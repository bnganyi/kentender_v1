<svg width="900" height="1000" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10263b"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="poly1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1978c8"/>
      <stop offset="100%" stop-color="#0f3a63"/>
    </linearGradient>
    <linearGradient id="poly2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ec4f5"/>
      <stop offset="100%" stop-color="#2490ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2490ef" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2490ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1000" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="720" cy="120" r="260" fill="url(#glow)"/>
  <circle cx="120" cy="880" r="300" fill="url(#glow)"/>

  <!-- faint wireframe polyhedron, top center -->
  <g stroke="#3f76ab" stroke-width="1" fill="none" opacity="0.6">
    <polygon points="430,40 520,90 520,180 430,230 340,180 340,90"/>
    <line x1="430" y1="40" x2="430" y2="230"/>
    <line x1="340" y1="90" x2="520" y2="180"/>
    <line x1="520" y1="90" x2="340" y2="180"/>
  </g>
  <g stroke="#2c5580" stroke-width="1" fill="none" opacity="0.5">
    <circle cx="430" cy="135" r="140"/>
  </g>

  <!-- low-poly shard cluster, top right -->
  <polygon points="900,40 900,260 760,190" fill="url(#poly1)"/>
  <polygon points="900,260 820,340 760,190" fill="url(#poly2)"/>
  <polygon points="900,40 760,190 780,60" fill="#0d2138"/>

  <!-- low-poly cluster, bottom left -->
  <polygon points="0,760 130,700 170,860 40,940" fill="url(#poly2)"/>
  <polygon points="0,760 0,940 40,940" fill="#123a5e"/>
  <circle cx="60" cy="980" r="60" fill="#bfe0fb"/>
  <circle cx="430" cy="965" r="42" fill="url(#poly1)" opacity="0.8"/>

  <!-- scattered dots / constellation, bottom left -->
  <g fill="#5fa3dd" opacity="0.8">
    <circle cx="30" cy="620" r="2"/>
    <circle cx="70" cy="650" r="2"/>
    <circle cx="20" cy="700" r="2"/>
    <circle cx="110" cy="600" r="2"/>
    <circle cx="150" cy="640" r="2"/>
    <circle cx="90" cy="560" r="2"/>
  </g>
  <g stroke="#2c5580" stroke-width="1" opacity="0.6">
    <line x1="30" y1="620" x2="70" y2="650"/>
    <line x1="70" y1="650" x2="20" y2="700"/>
    <line x1="30" y1="620" x2="110" y2="600"/>
    <line x1="110" y1="600" x2="150" y2="640"/>
    <line x1="90" y1="560" x2="30" y2="620"/>
  </g>

  <!-- wordmark -->
  <text x="450" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="3" fill="#ffffff">KENTENDER</text>

  <!-- tagline -->
  <text x="450" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#ffffff">Welcome Back Sign In To</text>
  <text x="450" y="585" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#ffffff">Your Account To Continue</text>
</svg>
