  "decisions": [
    {"decision_id":"DEC-001","decision":"Each site represents one procuring entity for MVP; organisational units are scoped within it.","status":"Approved","owner_doc":"CFG-CHG-002 / AUTH-ADR-001","implementation_effect":"Do not add routine procuring-entity selectors.","design_effect":"Show organisational scope only where it affects the task."},
    {"decision_id":"DEC-002","decision":"Departmental consultation is optional evidence, not a mandatory workflow gate.","status":"Approved","owner_doc":"NDS-CHG-001","implementation_effect":"Acceptance remains possible without consultation when authorised.","design_effect":"Keep consultation in supporting detail."},
    {"decision_id":"DEC-003","decision":"Requisitions and bids use structured requirement rows rather than attachment-first data capture.","status":"Approved","owner_doc":"REQ-CHG-001 / STD-TPL-001 / BDS-CHG-001","implementation_effect":"Preserve stable row identities and typed responses.","design_effect":"Generate concise task-oriented sections from metadata."},
    {"decision_id":"DEC-004","decision":"Tender formats are curated controlled releases; administrators do not build legal templates through a generic field wizard.","status":"Approved","owner_doc":"STD-TPL-001","implementation_effect":"Release tooling is controlled and manifest-based.","design_effect":"Admin UI is inspection and approval status, not raw schema editing. [26 Sep 2026, OD5: inspection only — no approval status or activation action; use is the site switch.]"},
    {"decision_id":"DEC-005","decision":"Move tender-format administration to a dedicated STD Templates menu.","status":"Approved","owner_doc":"STD-TPL-001 / CFG-CHG-002","implementation_effect":"One authoritative inspection surface.","design_effect":"List, detail, previews, verification and release state are visible."},
    {"decision_id":"DEC-006","decision":"The statutory 30% reservation denominator is the eligible value of the current complete APP, not the Budget ceiling.","status":"Approved","owner_doc":"LAW-REG-001 / PLN-CHG-001","implementation_effect":"Compute from APP items and preserve denominator evidence.","design_effect":"Show progress and lawful treatment without exposing internal rule machinery by default."},
    {"decision_id":"DEC-007","decision":"Budget ceiling and affordability remain separate from the statutory reservation measure.","status":"Approved","owner_doc":"BUD-CHG-001 / PLN-CHG-001","implementation_effect":"Separate services and data contracts.","design_effect":"Do not ask users to enter a reservation denominator in Budget."},
    {"decision_id":"DEC-008","decision":"County resident procurement is a separate measure from the 30% reservation programme.","status":"Approved","owner_doc":"LAW-REG-001 / PLN-CHG-001","implementation_effect":"Separate flags, rules and reports.","design_effect":"Do not combine them into one designation field or result."},
    {"decision_id":"DEC-009","decision":"Tender Preparation and Tender Publication form one Tenders module and one coherent user journey.","status":"Approved","owner_doc":"TPR-CHG-001","implementation_effect":"One lifecycle and ownership model.","design_effect":"Preparation naturally continues into approval and publication evidence."},
    {"decision_id":"DEC-010","decision":"For MVP, HOPF may manually confirm publication evidence for any configured channel; integration is not presumed.","status":"Approved","owner_doc":"TPR-CHG-001 / CFG-CHG-002","implementation_effect":"Support manual evidence with actor/time/digest/reference.","design_effect":"Show one channel list with the appropriate confirmation action."},
    {"decision_id":"DEC-011","decision":"Suppliers start a bid atomically; there is no separate Declare interest or Follow Tender workflow.","status":"Approved","owner_doc":"BDS-CHG-001","implementation_effect":"Create candidate registration, contact and workspace together.","design_effect":"Use one direct Start bid action."},
    {"decision_id":"DEC-012","decision":"General clarifications may be published before the deadline without disclosing candidate identity.","status":"Approved","owner_doc":"TPR-CHG-001 / BDS-CHG-001","implementation_effect":"Separate question identity from public answer content.","design_effect":"Suppliers see published clarification updates in the workspace."},
    {"decision_id":"DEC-013","decision":"Any change to issued tender requirements requires an addendum with immutable identity and acknowledgement treatment.","status":"Approved","owner_doc":"TPR-CHG-001 / BDS-CHG-001","implementation_effect":"Clarification cannot mutate published rows.","design_effect":"Clearly distinguish Clarification from Addendum."},
    {"decision_id":"DEC-014","decision":"Production electronic submission remains disabled by one deployment flag until operating and release gates pass.","status":"Approved","owner_doc":"BDS-CHG-001 / G1-REG-001","implementation_effect":"Central gate; drafts remain safe.","design_effect":"Use the approved temporary-unavailability message."},
    {"decision_id":"DEC-015","decision":"Gate 1 ends when a sealed Bid Submission handoff is created; opening and evaluation are outside the current slice.","status":"Approved","owner_doc":"G1-REG-001 / BDS-CHG-001","implementation_effect":"No premature downstream state changes.","design_effect":"Receipt and submitted state only."},
    {"decision_id":"DEC-016","decision":"Bid Opening, Evaluation and Award, Supplier Management, additional methods/products, Contract Management and integrations remain explicitly planned future work.","status":"Approved","owner_doc":"KT-RCA-001 / G1-REG-001","implementation_effect":"Preserve extension contracts without implementing hidden workflows.","design_effect":"Do not expose placeholder journeys as current capability."},
    {"decision_id":"DEC-017","decision":"No meaningful record state may dead-end: the server must return exactly one actionable-now, waiting, blocked-with-remedy or completed next-step outcome for the current responsibility.","status":"Approved","owner_doc":"KT-STD-001 v1.8 / current module document","implementation_effect":"Centralise next-step and guard evaluation and test every supported persona/state pair.","design_effect":"Show one direct next-step block with owner and correction route; do not leave users to infer workflow from status."},
    {"decision_id":"DEC-018","decision":"A Planning budget revision request is a cross-module hand-off only; it is not an amount change, reservation, budget revision or approval.","status":"Approved","owner_doc":"PLN-CHG-001 v1.27 / BUD-CHG-001 v1.11","implementation_effect":"Keep Planning request identity and Budget-owned outcome separate from allocation facts.","design_effect":"Explain what was requested, who acts next and what outcome returned without implying that funding changed."},
    {"decision_id":"DEC-021","decision":"STD Templates is a transparent inspection and concern surface, not a runtime legal-template editor or second site-approval workflow.","status":"Proposed","owner_doc":"STD-TPL-001 v0.10 / STD-TPL-IMP-001 v1.0","implementation_effect":"Install exact approved assets and expose projections; prohibit editable content DocTypes. [26 Sep 2026, OD5: install the exact intact assets (no approval precondition), switched On by default; switch by deployment command.]","design_effect":"Show coverage, exclusions, changes and gates with bounded Report concern."},
    {"decision_id":"DEC-022","decision":"Fixture and production Bid-definition generation use one deterministic compiler and releases bind a versioned renderer adapter.","status":"Proposed","owner_doc":"STD-TPL-001 v0.10 / STD-TPL-IMP-001 v1.0","implementation_effect":"One compiler implementation; adapter-bound rendering; no arbitrary fallback.","design_effect":"Routine users see supported/unavailable outcomes; technical identities remain in collapsed detail."},
    {"decision_id":"DEC-023","decision":"A release lifecycle change never automatically rebinds a Tender; Superseded may continue only with integrity, while Withdrawn blocks unpublished continuation. [26 Sep 2026, OD5: a site switch Off blocks only new binding; it never strands a started Tender.]","status":"Proposed","owner_doc":"STD-TPL-001 v0.10 / TPR-CHG-001 v0.11","implementation_effect":"Enforce the action matrix at every boundary and preserve published history.","design_effect":"Show successor/withdrawal notice and one governed next step without an upgrade selector."},
    {"decision_id":"DEC-019","decision":"Plan activation creates a REQ-owned Purchase ready for requisition item in the existing Ready to start surface.","status":"Approved","owner_doc":"PLN-CHG-001 v1.27 / REQ-CHG-001 v1.12","implementation_effect":"Use the existing requisition aggregate and lifecycle; add no parallel task record, state, role, command or approval stage.","design_effect":"Expose the ready item in the current requisition workspace, not as another screen or queue."},
    {"decision_id":"DEC-020","decision":"Journey orientation must help users act without duplicating or overwhelming the primary task.","status":"Approved","owner_doc":"KT-STD-001 v1.8 / Workflow Guidance Standard","implementation_effect":"Derive restrained journey context from authoritative workflow state and hand-offs.","design_effect":"Use concise stage orientation and supporting detail; never replace clear task language with internal state machinery."},
    {"decision_id":"DEC-024","decision":"A template release is purely an On/Off switch on a site. An intact release installs Available and switched On; gate results and owner decisions are recorded evidence and never condition use; switching Off stops new binding only.","status":"Approved","owner_doc":"Project Owner instruction 26 Sep 2026 (\"I don't want this complicated admin overhead regarding approvals and commissioning of templates. It is unnecessary, adds no value and is vexing. Allow development work to contine without this friction. Template release is purely an on and off switch on an affected site. Update this decision as a follow up to reflect in affected documents if necessary\"); reflected in STD-TPL-001 v0.11, STD-TPL-IMP-001 v1.1, TPR-CHG-001 v0.12, REQ-CHG-001 v1.13, BDS-CHG-001 v0.8, G1-REG-001 v1.2","implementation_effect":"No Candidate state; installer switches On by default; `make std-release-switch STATE=On|Off`; binding requires the switched-on Available release for a new Tender only.","design_effect":"STD Templates shows a live Site switch row and live blockers; no approval or activation action."}
