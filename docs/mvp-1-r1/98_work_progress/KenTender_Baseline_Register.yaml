      "implementation_effect": "Two required Tender controls with no default, review rules, projection and selector facts (frozen releases unchanged), BDS reads, an explicit-review read. A successor template release for conditional response fields is owed.",
      "design_effect": "Tender details task gains two selects; supplier form shows what the Tender states."
    },
    {
      "decision_id": "DEC-051",
      "decision": "Opening incident records and the opening records that carry an envelope identifier or a bidder's name are sealed: no list, count, report, export, link search, form load or direct read for any technical account, and System Manager status alone grants no access; operational identifiers appear only inside the opening's own workflow; incident search is removed; notices link to the opening page.",
      "status": "Approved 10 October 2026",
      "owner_doc": "Approved 11 October 2026: successors of BOP-CHG-001 (section 6, BOP-N22), AUTH-ADR-001 (section 8, AUTH-AC-057) and TRUST-ADR-001 (section 2B); Project Owner, 10 October 2026.",
      "implementation_effect": "Five Bid Opening doctypes sealed (permissions removed, controller refusal, deny hooks), technical search resolver removed, opening page hides incidents from a technical reader without the support assignment. An audit event for support reads of incident details is not built.",
      "design_effect": "Technical status reads Held by Opening access support."
    },
    {
      "decision_id": "DEC-052",
      "decision": "No unrestricted break-glass access to sealed bids exists in the MVP; failures fail closed and support investigates through restricted diagnostics without bid content; operational recovery is kept separate from access to sealed contents; the absence of break-glass does not justify an administrator bypass.",
      "status": "Approved 10 October 2026",
      "owner_doc": "Approved 11 October 2026: successors of TRUST-ADR-001 (section 2B) and BDS-CHG-001 (section 12.3); Project Owner, 10 October 2026.",
      "implementation_effect": "No code path added; existing failures already fail closed.",
      "design_effect": "None."
    },
    {
      "decision_id": "DEC-053",
      "decision": "Amendment of a published Tender’s tender-security statements uses the existing addendum process: no separate kind of addendum and no republication. Missing system data for a requirement the published Tender already makes explicit is populated by an auditable correction that preserves the published requirement; a requirement that genuinely changes is a formal addendum before closing, communicated to bidders under the deadline-extension rules; closed Tenders keep their issued requirements.",
      "status": "Approved 10 October 2026",
      "owner_doc": "Approved 11 October 2026: successors of TPR-CHG-001 (section 24) and BDS-CHG-001 (section 4.8); Project Owner, 10 October 2026, quoted in part in each control table.",
      "implementation_effect": "Two non-material addendum rows with option lists, CorrectSecurityStatement with an append-only Tender Security Statement, bid-definition projection and BDS reads that honour the correction. A screen for the correction is not built.",
      "design_effect": "Addendum editor offers a choice list for the two rows."
    },
    {
      "decision_id": "DEC-054",
      "decision": "Template release 1.5 makes the bidder’s tender-security evidence follow the Tender’s submission method (upload: attachment required; issuer-supplied: no bidder upload; paper: prescribed electronic copy plus delivery instructions; none: no security inputs, supported but not offered); a new release reaches new Tenders and unpublished Drafts only through an explicit update and published Tenders keep their release; a pending issuer response is never a submission blocker.",
      "status": "Approved 10 October 2026",
      "owner_doc": "Approved 11 October 2026: successors of STD-TPL-001 (section 18.9), TPR-CHG-001 (section 24.2) and BDS-CHG-001 (section 4.8); Project Owner, 10 October 2026.",
      "implementation_effect": "Release 1.5 built and installed on the test site; UpdateDraftTemplateRelease; BDS reads either security rule. The fourth method awaits an Owner-approved document variant.",
      "design_effect": "Draft release notice offers Update to the current release."
    },
    {
      "decision_id": "DEC-055",
      "decision": "Reading an Opening incident’s details, and exporting it, are audited with actor, time, incident, action, purpose and outcome; the event holds no incident content, the trail is restricted to the Auditor and the Accounting Officer, and a page refresh records nothing.",
      "status": "Approved 10 October 2026",
      "owner_doc": "Approved 11 October 2026: successors of BOP-CHG-001 (section 6, BOP-N23 to BOP-N26), AUTH-ADR-001 (section 8, AUTH-AC-058) and TRUST-ADR-001 (section 2B); Project Owner, 10 October 2026.",
      "implementation_effect": "GetIncidentDetails, the Export event, GetIncidentAccessTrail and a sealed Opening Incident Access Event record.",
      "design_effect": "Incident details panel names a purpose before showing details."
    },
    {
      "decision_id": "DEC-056",
      "decision": "PR-001’s incident-recovery procedure is drafted as TRUST-OPS-001 and is tested before production; any exceptional access to sealed contents remains a separately reviewed design; the Documentation Control workbook is brought into line with this register.",
      "status": "Approved 10 October 2026",
      "owner_doc": "Approved 11 October 2026: TRUST-OPS-001 (first version) and successor of TRUST-ADR-001 (section 2B); Project Owner, 10 October 2026.",
      "implementation_effect": "No code. The procedure is operational only after approval and the section 11 tests.",
      "design_effect": "None."
    }
