      "decision": "Tender formats are curated controlled releases; administrators do not build legal templates through a generic field wizard.",
      "status": "Approved",
      "owner_doc": "STD-TPL-001",
      "implementation_effect": "Release tooling is controlled and manifest-based.",
      "design_effect": "Admin UI shows content and site On/Off state, never a generic schema editor."
