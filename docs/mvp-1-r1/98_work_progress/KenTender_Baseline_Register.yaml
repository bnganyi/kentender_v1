  "decisions": [
    {
      "decision_id": "DEC-001",
      "decision": "Each site represents one procuring entity for MVP; organisational units are scoped within it.",
      "status": "Approved",
      "owner_doc": "CFG-CHG-002 / AUTH-ADR-001",
      "implementation_effect": "Do not add routine procuring-entity selectors.",
      "design_effect": "Show organisational scope only where it affects the task."
    },
    {
      "decision_id": "DEC-002",
      "decision": "Departmental consultation is optional evidence, not a mandatory workflow gate.",
      "status": "Approved",
      "owner_doc": "NDS-CHG-001",
      "implementation_effect": "Acceptance remains possible without consultation when authorised.",
      "design_effect": "Keep consultation in supporting detail."
    },
    {
      "decision_id": "DEC-003",
      "decision": "Requisitions and bids use structured requirement rows rather than attachment-first data capture.",
      "status": "Approved",
      "owner_doc": "REQ-CHG-001 / STD-TPL-001 / BDS-CHG-001",
      "implementation_effect": "Preserve stable row identities and typed responses.",
      "design_effect": "Generate concise task-oriented sections from metadata."
    },
    {
      "decision_id": "DEC-004",
      "decision": "Tender formats are curated controlled releases; administrators do not build legal templates through a generic field wizard.",
      "status": "Approved",
      "owner_doc": "STD-TPL-001",
      "implementation_effect": "Release tooling is controlled and manifest-based.",
      "design_effect": "Admin UI shows content and site On/Off state, never a generic schema editor."
    },
    {
      "decision_id": "DEC-005",
      "decision": "Move tender-format administration to a dedicated STD Templates menu.",
      "status": "Approved",
      "owner_doc": "STD-TPL-001 / CFG-CHG-002",
      "implementation_effect": "One authoritative inspection surface.",
      "design_effect": "List, detail, previews, verification and release state are visible."
    },
    {
      "decision_id": "DEC-006",
      "decision": "The statutory 30% reservation denominator is the eligible value of the current complete APP, not the Budget ceiling.",
      "status": "Approved",
      "owner_doc": "LAW-REG-001 / PLN-CHG-001",
      "implementation_effect": "Compute from APP items and preserve denominator evidence.",
      "design_effect": "Show progress and lawful treatment without exposing internal rule machinery by default."
    },
    {
      "decision_id": "DEC-007",
      "decision": "Budget ceiling and affordability remain separate from the statutory reservation measure.",
      "status": "Approved",
      "owner_doc": "BUD-CHG-001 / PLN-CHG-001",
      "implementation_effect": "Separate services and data contracts.",
      "design_effect": "Do not ask users to enter a reservation denominator in Budget."
    },
    {
      "decision_id": "DEC-008",
      "decision": "County resident procurement is a separate measure from the 30% reservation programme.",
      "status": "Approved",
      "owner_doc": "LAW-REG-001 / PLN-CHG-001",
      "implementation_effect": "Separate flags, rules and reports.",
      "design_effect": "Do not combine them into one designation field or result."
    },
    {
      "decision_id": "DEC-009",
      "decision": "Tender Preparation and Tender Publication form one Tenders module and one coherent user journey.",
      "status": "Approved",
      "owner_doc": "TPR-CHG-001",
      "implementation_effect": "One lifecycle and ownership model.",
      "design_effect": "Preparation naturally continues into approval and publication evidence."
    },
    {
      "decision_id": "DEC-010",
      "decision": "For MVP, HOPF may manually confirm publication evidence for any configured channel; integration is not presumed.",
      "status": "Approved",
      "owner_doc": "TPR-CHG-001 / CFG-CHG-002",
      "implementation_effect": "Support manual evidence with actor/time/digest/reference.",
      "design_effect": "Show one channel list with the appropriate confirmation action."
    },
    {
      "decision_id": "DEC-011",
      "decision": "Suppliers start a bid atomically; there is no separate Declare interest or Follow Tender workflow.",
      "status": "Approved",
      "owner_doc": "BDS-CHG-001",
      "implementation_effect": "Create candidate registration, contact and workspace together.",
      "design_effect": "Use one direct Start bid action."
    },
    {
      "decision_id": "DEC-012",
      "decision": "General clarifications may be published before the deadline without disclosing candidate identity.",
      "status": "Approved",
      "owner_doc": "TPR-CHG-001 / BDS-CHG-001",
      "implementation_effect": "Separate question identity from public answer content.",
      "design_effect": "Suppliers see published clarification updates in the workspace."
    },
    {
      "decision_id": "DEC-013",
      "decision": "Any change to issued tender requirements requires an addendum with immutable identity and acknowledgement treatment.",
      "status": "Approved",
      "owner_doc": "TPR-CHG-001 / BDS-CHG-001",
      "implementation_effect": "Clarification cannot mutate published rows.",
      "design_effect": "Clearly distinguish Clarification from Addendum."
    },
    {
      "decision_id": "DEC-014",
      "decision": "Production electronic submission remains disabled by one deployment flag until operating and release gates pass.",
      "status": "Approved",
      "owner_doc": "BDS-CHG-001 / G1-REG-001",
      "implementation_effect": "Central gate; drafts remain safe.",
      "design_effect": "Use the approved temporary-unavailability message."
    },
    {
      "decision_id": "DEC-015",
      "decision": "Gate 1 ends when a sealed Bid Submission handoff is created; opening and evaluation are outside the current slice.",
      "status": "Approved",
