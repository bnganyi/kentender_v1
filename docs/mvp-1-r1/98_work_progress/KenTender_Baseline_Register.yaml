    {
      "decision_id": "DEC-001",
      "decision": "Each site represents one procuring entity for MVP; organisational units are scoped within it.",
      "status": "Approved",
      "owner_doc": "CFG-CHG-002 / AUTH-ADR-001",
      "implementation_effect": "Do not add routine procuring-entity selectors.",
      "design_effect": "Show organisational scope only where it affects the task."
    },
    {
      "decision_id": "DEC-002",
      "decision": "Departmental consultation is optional evidence, not a mandatory workflow gate.",
      "status": "Approved",
      "owner_doc": "NDS-CHG-001",
      "implementation_effect": "Acceptance remains possible without consultation when authorised.",
      "design_effect": "Keep consultation in supporting detail."
    },
    {
      "decision_id": "DEC-003",
      "decision": "Requisitions and bids use structured requirement rows rather than attachment-first data capture.",
      "status": "Approved",
      "owner_doc": "REQ-CHG-001 / STD-TPL-001 / BDS-CHG-001",
      "implementation_effect": "Preserve stable row identities and typed responses.",
      "design_effect": "Generate concise task-oriented sections from metadata."
    },
