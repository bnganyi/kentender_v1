      "action": "Approved 16 October 2026 (v0.10): the coordinated funding specification (section 20), the funding screens inside the existing intake and opening screens (section 10.9) and CM-AC-85 to -96. Build state, 17 October 2026 (no approval is evidence of it): the coordinated funding build is implemented and partly verified on the test site only; the development site is untouched. Verified: Budget app (all 30 modules) and its funding entry module 67/67, Budget browser specs 13/13 as the normal roles, Award chain (all modules, with the funding allocation module 33/33), Contract Management funding module 38/38 and the notification, dead-end, date, import-boundary and navigation guards. Not done: the real Award to Contract Management to Budget journey on the canonical award (the test site's canonical reservations were purged by a Budget browser fixture and the rebuild is awaiting the Project Owner), a normal migrate on the verification site, and a browser walk of the Contract Management funding screens. Detail: docs/mvp-1-r1/03_budget/BUD-CHG-001_IMPLEMENTATION_TRACKER.md addendum of 17 October 2026. (Earlier record, retained: Approved 14 October 2026 (v0.8), as the document's own control table states; the file is docs/mvp-1-r1/21_contract_management/KenTender_CM-CHG-001_Contract_Management_v0_8.md. Added to this register on 15 October 2026 at the Project Owner's request (“4. Yes”); the register's statuses follow the document and the repository, not a new decision. Implementation is in progress (phases 3 to 12 committed on 15 October 2026; see docs/mvp-1-r1/21_contract_management/CM-CHG-001_v0_8_IMPLEMENTATION_TRACKER.md for each gate); verification is pending; no release is approved. The register's FW-008 and DEC-016 still describe Contract Management as planned future work and are not changed here: the Project Owner has not stated the release-slice scope. LQ-01 to LQ-06 and the implementation, evidence and release conditions remain outstanding. Its follow-up FU-CM-61 is decided by DEC-057 and DEC-060. v0.9 proposed 16 October 2026: the Contract Management side of three Budget decisions (conversion event contents, correction of a Closed commitment through Budget, funding of a contract with no tender in KenTender); reviewed together with the matching proposed Budget amendment (see the BUD-CHG-001 entry). v0.8 remains the approved baseline.)",
