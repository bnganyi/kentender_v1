<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/styles.css">
<script src="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/_ds_bundle.js"></script>
<style>
  body { margin: 0; background: #6b6f73; }
  .kt-ro { height: 40px; display: flex; align-items: center; padding: 0; font-size: 14px; border-bottom: 1px solid var(--color-divider); color: var(--color-text); }
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 0">
<div style="width:1440px;min-width:1440px;flex:none;height:1024px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden;display:flex;flex-direction:column">

  <div style="padding:36px 48px 0;display:flex;flex-direction:column;gap:12px">
    <h1 style="margin:0;font-size:38px;line-height:1.05;letter-spacing:.005em">New financial year</h1>
    <div><span class="kt-status is-draft">Draft</span></div>
  </div>

  <div style="margin:36px 48px 0;flex:1">
    <div class="card blueprint" style="padding:26px 28px;gap:20px;max-width:920px">
      <h2 class="kt-card-title">Financial year</h2>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px">
        <div class="field">
          <label for="fy-start-year">Start year</label>
          <input class="input" id="fy-start-year" type="text" value="2028" style="height:40px">
        </div>
        <div class="field">
          <label>Financial year</label>
          <div class="kt-ro">2028/29</div>
        </div>
        <div class="field">
          <label>Start date</label>
          <div class="kt-ro">1 Jul 2028</div>
        </div>
        <div class="field">
          <label>End date</label>
          <div class="kt-ro">30 Jun 2029</div>
        </div>
        <div class="field">
          <label>Timezone</label>
          <div class="kt-ro">Africa/Nairobi</div>
        </div>
      </div>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    </div>
  </div>

  <div style="border-top:1px solid var(--color-divider);padding:20px 48px;display:flex;justify-content:flex-end;gap:14px">
    <button type="button" class="btn btn-ghost" style="height:40px;padding:0 20px;font-size:14px">Cancel</button>
    <button type="button" class="btn btn-secondary" style="height:40px;padding:0 20px;font-size:14px">Save draft</button>
    <button type="button" class="btn btn-primary blueprint" style="height:40px;padding:0 20px;font-size:14px;white-space:nowrap">Submit for approval<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></button>
  </div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1080}}"></script>
</body>
</html>
