<!-- @dsCard group="Components" viewport="640x220" name="KPI cards" subtitle="Summary metrics; top accent appears only past a threshold" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:32px"><h5 style="margin-bottom:16px">KPI cards</h5>
<div class="kt-kpi-row" style="max-width:640px">
<div class="kt-kpi-card"><svg class="kt-kpi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="0"/><path d="M3 9h18"/></svg><div class="kt-kpi-value">128</div><div class="kt-kpi-sub">Active tenders</div></div>
<div class="kt-kpi-card is-attention"><svg class="kt-kpi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg><div class="kt-kpi-value">6</div><div class="kt-kpi-sub">Awaiting evaluation</div></div>
<div class="kt-kpi-card is-critical"><svg class="kt-kpi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg><div class="kt-kpi-value">3</div><div class="kt-kpi-sub">Suspended bids</div></div>
</div>
</body></html>
