<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/kentender-industry-82d82607-fd52-491b-bef1-023d4ec3bd0c/styles.css">
  <script src="_ds/kentender-industry-82d82607-fd52-491b-bef1-023d4ec3bd0c/_ds_bundle.js"></script>
  <style>
    body { margin: 0; }
    a { color: var(--color-accent-700); }
    a:hover { color: var(--color-accent-900); }
  </style>
</helmet>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);display:flex;flex-direction:column;">

  <div style="padding:12px 40px;">
    <a href="Index.dc.html" style="color:var(--color-neutral-700);font-size:12px;text-decoration:none;">&larr; Index</a>
  </div>

  <div data-screen-label="BUD-DES-02 Record approved allocation" style="flex:1;max-width:760px;margin:0 auto;padding:20px 40px 60px;width:100%;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
      <h1 style="font-family:var(--font-heading);font-weight:600;font-size:30px;margin:0;letter-spacing:.01em;">Record approved allocation</h1>
      <span class="kt-status is-draft">Draft</span>
    </div>
    <p style="font-size:14px;color:var(--color-neutral-700);margin:0 0 24px;max-width:60ch;">Enter the allocation approved outside KenTender and attach its approval document.</p>

    <div class="card blueprint elev-sm" style="padding:24px;margin-bottom:20px;">
      <h3 class="kt-card-title" style="margin:0 0 16px;">Budget context</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="field"><label>Financial Year</label><div class="input" style="background:var(--color-surface-2);color:var(--color-neutral-800);display:flex;align-items:center;">FY 2027/28</div></div>
        <div class="field"><label>Currency</label><div class="input" style="background:var(--color-surface-2);color:var(--color-neutral-800);display:flex;align-items:center;">KES</div></div>
      </div>
    </div>

    <div class="card blueprint elev-sm" style="padding:24px;margin-bottom:20px;">
      <h3 class="kt-card-title" style="margin:0 0 16px;">External approval</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="field"><label>Approval reference</label><input class="input" value="MOH-FIN-BUD-2027-01 (Demo)" /></div>
        <div class="field"><label>Approval date</label><div class="date-field"><span>30 Sep 2026</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></div></div>
        <div class="field"><label>Approved allocation</label>
          <div style="display:flex;">
            <span style="display:flex;align-items:center;padding:0 10px;border:1px solid var(--color-divider);border-right:0;background:var(--color-surface-2);font-size:14px;color:var(--color-neutral-700);">KES</span>
            <input class="input" style="border-left:0;" value="160,000,000" />
          </div>
        </div>
        <div class="field"><label>Approval document</label>
          <div class="input" style="display:flex;align-items:center;gap:8px;height:auto;min-height:36px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:var(--color-neutral-600);"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
            <span style="font-size:13px;">MOH Approved Procurement Budget 2027-28 (Demo).pdf</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:sticky;bottom:0;background:var(--color-surface);border-top:1px solid var(--color-divider);padding:16px 40px;display:flex;justify-content:flex-end;gap:12px;">
    <button type="button" class="btn btn-secondary">Cancel</button>
    <button type="button" class="btn btn-primary">Save and add budget lines</button>
  </div>
</div>

</x-dc>
</body>
</html>
