<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/styles.css">
  <script src="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/_ds_bundle.js"></script>
  <style>
    body { margin: 0; }
    a { color: var(--color-accent-700); }
    a:hover { color: var(--color-accent-900); }
    .kt-field-label { font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); display: block; }
    .kt-field-static {
      min-height: 36px; padding: 6px 10px; font-size: 14px; display: flex; align-items: center;
      background: var(--color-neutral-100); border: 1px solid var(--color-divider); border-radius: var(--radius-md);
      color: color-mix(in srgb, var(--color-text) 85%, transparent);
    }
    .kt-input-prefix {
      min-height: 36px; padding: 6px 10px; font-size: 14px; display: flex; align-items: center; gap: 6px;
      background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md);
    }
    .kt-input-prefix span.prefix { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
    .kt-file-row {
      min-height: 36px; padding: 6px 10px; font-size: 14px; display: flex; align-items: center; gap: 8px;
      background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md);
    }
  </style>
</helmet>
<div style="width:1440px;height:1024px;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text);box-sizing:border-box;position:relative;overflow:hidden">
  <div style="max-width:1200px;margin:0 auto;padding:32px 0 96px;display:flex;flex-direction:column">

    <div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:12px">
        <h1 style="margin:0">Register approved budget</h1>
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px 3px 8px;border-radius:6px;background:var(--color-accent-100);color:var(--color-accent-800)"><span style="width:6px;height:6px;border-radius:50%;background:var(--color-accent-600);display:inline-block"></span>Draft</span>
      </div>
    </div>

    <div class="card blueprint" style="margin-bottom:16px;padding:20px 24px">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="kt-card-title" style="font-family:var(--font-heading);font-weight:600;text-transform:uppercase;font-size:15px;letter-spacing:0.02em;border-bottom:2px solid var(--color-accent);display:inline-block;padding-bottom:6px;margin-bottom:16px">Budget context</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px">
        <div>
          <label class="kt-field-label">Budget reference</label>
          <div class="kt-field-static">Not assigned</div>
        </div>
        <div>
          <label class="kt-field-label">Procuring Entity</label>
          <div class="kt-field-static">PE-MOH — Ministry of Health</div>
        </div>
        <div>
          <label class="kt-field-label">Financial Year</label>
          <div class="kt-field-static">FY 2027/28</div>
        </div>
        <div>
          <label class="kt-field-label">Currency</label>
          <div class="kt-field-static">KES</div>
        </div>
      </div>
    </div>

    <div class="card blueprint" style="padding:20px 24px">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="kt-card-title" style="font-family:var(--font-heading);font-weight:600;text-transform:uppercase;font-size:15px;letter-spacing:0.02em;border-bottom:2px solid var(--color-accent);display:inline-block;padding-bottom:6px;margin-bottom:16px">External approval</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px">
        <div class="field">
          <label for="approval-ref">Approval reference</label>
          <input class="input" id="approval-ref" value="MOH-FIN-BUD-2027-01 (Demo)">
        </div>
        <div class="field">
          <label for="approval-date">Approval date</label>
          <div class="input" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span>30 Sep 2026</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:color-mix(in srgb, var(--color-text) 55%, transparent)"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          </div>
        </div>
        <div class="field">
          <label for="authorised-total">Authorised total</label>
          <div class="kt-input-prefix"><span class="prefix">KES</span><input class="input" id="authorised-total" style="border:none;background:transparent;padding:0;min-height:auto" value="160,000,000"></div>
        </div>
        <div class="field">
          <label>Approval document</label>
          <div class="kt-file-row" style="justify-content:space-between">
            <div style="display:flex;align-items:center;gap:8px;overflow:hidden">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:var(--color-accent-700)"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6"/></svg>
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">MOH Approved Procurement Budget 2027-28 (Demo).pdf</span>
            </div>
            <button type="button" class="btn btn-ghost" style="flex:none;font-size:13px;padding:2px 4px">Replace</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--color-divider);background:var(--color-bg);padding:16px 0">
    <div style="max-width:1200px;margin:0 auto;display:flex;justify-content:flex-end;gap:12px">
      <button type="button" class="btn btn-secondary" style="border-color:color-mix(in srgb, var(--color-text) 30%, transparent)">Cancel</button>
      <button type="button" class="btn btn-primary">Save draft</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1024}}"></script>
</body>
</html>
