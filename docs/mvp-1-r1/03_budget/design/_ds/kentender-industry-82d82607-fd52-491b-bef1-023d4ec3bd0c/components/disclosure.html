<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:32px;max-width:560px"><h5 style="margin-bottom:16px">Disclosure</h5>
<div class="kt-disclosure">
<div class="kt-disclosure-head" onclick="var b=this.nextElementSibling,c=this.querySelector('.kt-disclosure-chevron');var open=b.style.display!=='none';b.style.display=open?'none':'block';c.classList.toggle('is-open',!open)">
<div class="kt-disclosure-title-row"><span class="kt-disclosure-title">Eligibility criteria</span><span class="tag tag-neutral">4 items</span></div>
<svg class="kt-disclosure-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9l6 6 6-6"/></svg>
</div>
<div class="kt-disclosure-body">
<p class="card-body">Bidders must hold current registration, a valid tax clearance certificate, minimum three years' trading history, and professional indemnity cover of at least $2M.</p>
</div>
</div>
</body></html>
