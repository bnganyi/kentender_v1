<div style="background: var(--color-bg); width: 1440px; min-height: 1024px; font-family: var(--font-body); color: var(--color-text); position: relative;">

    <div style="width: 1200px; padding: 32px 0;">
      <div style="font-family: var(--font-heading); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--color-accent-700);">DEPARTMENTAL REVIEW · NDS-MOH-2027-0002 · VERSION 1</div>
      <div style="display: flex; align-items: center; gap: 12px; margin: 4px 0 20px;">
        <h1 style="font-family: var(--font-heading); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.01em;">Digital health workforce certification programme</h1>

      </div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: color-mix(in oklch, var(--color-text) 35%, transparent); display: flex; align-items: center; justify-content: center;">
    <div class="dialog blueprint" style="width: 520px; background: var(--color-bg); padding: 24px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

      </div>
      <div class="dialog-actions" style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px;">
