<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/styles.css">
  <script src="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/_ds_bundle.js"></script>
  <style>
    .kt-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 6px; font-family: var(--font-body); font-size: 12.5px; font-weight: 600; }
    .kt-status .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .kt-status.is-draft { background: oklch(93% 0.03 250); color: oklch(35% 0.08 250); }
    .kt-status.is-draft .dot { background: oklch(50% 0.13 250); }
    .kt-readonly-row + .kt-readonly-row { margin-top: 14px; }
    textarea.input { resize: vertical; min-height: 72px; font-family: var(--font-body); }
  </style>
</helmet>
<div style="background: var(--color-bg); width: 1440px; min-height: 1024px; font-family: var(--font-body); color: var(--color-text); display: flex; justify-content: center;">
  <div style="width: 1200px; padding: 32px 0 110px; position: relative;">

    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <h1 style="font-family: var(--font-heading); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.01em;">Create need</h1>
      <span class="kt-status is-draft"><i class="dot"></i>New</span>
    </div>
    <p style="font-size: 15px; color: var(--color-neutral-700); max-width: 640px; margin: -14px 0 24px;">Describe one requirement your department expects to include in procurement planning.</p>

    <div class="card blueprint" style="margin-bottom: 16px; padding: 20px 24px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
        <div class="kt-readonly-row">
          <div style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 4px;">Procuring Entity</div>
          <div style="font-size: 14.5px; font-weight: 500;">PE-MOH — Ministry of Health</div>
        </div>
        <div class="kt-readonly-row">
          <div style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 4px;">Department</div>
          <div style="font-size: 14.5px; font-weight: 500;">OU-MOH-DHI — Digital Health</div>
        </div>
        <div class="kt-readonly-row">
          <div style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 4px;">Financial Year</div>
          <div style="font-size: 14.5px; font-weight: 500;">FY 2027/28</div>
        </div>
      </div>
    </div>

    <div class="card blueprint" style="margin-bottom: 16px; padding: 20px 24px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="kt-card-title" style="margin-bottom: 16px;">Requirement</div>
      <div class="field" style="margin-bottom: 16px;">
        <label>Title</label>
        <input class="input" type="text" value="National digital health infrastructure upgrade">
      </div>
      <div class="field" style="margin-bottom: 16px;">
        <label>Description</label>
        <textarea class="input">Procure and implement national digital health infrastructure across priority health facilities.</textarea>
      </div>
      <div class="field" style="margin-bottom: 0;">
        <label>Business justification</label>
        <textarea class="input">Improve availability and reliability of interoperable digital health services used by priority health facilities.</textarea>
      </div>
    </div>

    <div class="card blueprint" style="padding: 20px 24px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="kt-card-title" style="margin-bottom: 16px;">Quantity and timing</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div class="field" style="margin: 0;">
          <label>Indicative quantity</label>
          <input class="input" type="text" value="1">
        </div>
        <div class="field" style="margin: 0;">
          <label>Unit</label>
          <select class="input">
            <option>Programme</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin: 0; max-width: 340px;">
        <label>Required by</label>
        <input class="input" type="text" value="31 Aug 2027">
      </div>
    </div>

    <div style="position: sticky; bottom: 0; left: 0; width: 1200px; background: var(--color-bg); border-top: 1px solid var(--color-neutral-200); padding: 16px 0; display: flex; align-items: center; justify-content: space-between; margin-top: 16px;">
      <button class="btn btn-ghost">Cancel</button>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-secondary">Save draft</button>
        <button class="btn btn-primary">Submit for review</button>
      </div>
    </div>

  </div>
</div>

</x-dc>
</body>
</html>
