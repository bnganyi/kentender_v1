<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/styles.css">
  <script src="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/_ds_bundle.js"></script>
  <style>
    .kt-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 6px; font-family: var(--font-body); font-size: 12.5px; font-weight: 600; }
    .kt-status .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .kt-status.is-live { background: oklch(93% 0.06 155); color: oklch(30% 0.09 155); }
    .kt-status.is-live .dot { background: oklch(45% 0.13 155); }
  </style>
</helmet>
<div style="background: var(--color-bg); width: 1440px; min-height: 1024px; font-family: var(--font-body); color: var(--color-text); display: flex; justify-content: center;">
  <div style="width: 1200px; padding: 32px 0 110px; position: relative;">

    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
      <h1 style="font-family: var(--font-heading); font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.01em;">Intake window</h1>
      <span class="kt-status is-live"><i class="dot"></i>Open</span>
    </div>
    <div style="font-family: var(--font-heading); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--color-accent-700); margin-bottom: 6px;">DEPARTMENTAL NEEDS CONFIGURATION</div>
    <p style="font-size: 15px; color: var(--color-neutral-700); max-width: 640px; margin: 0 0 24px;">Set when departments may create and initially submit needs for this Financial Year.</p>

    <div class="card blueprint" style="margin-bottom: 16px; padding: 20px 24px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <div style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 4px;">Procuring Entity</div>
          <div style="font-size: 14.5px; font-weight: 500;">PE-MOH — Ministry of Health</div>
        </div>
        <div>
          <div style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 4px;">Financial Year</div>
          <div style="font-size: 14.5px; font-weight: 500;">FY 2027/28</div>
        </div>
      </div>
    </div>

    <div class="card blueprint" style="padding: 20px 24px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="kt-card-title" style="margin-bottom: 16px;">Window</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="field" style="margin: 0;">
          <label>Opens at</label>
          <input class="input" type="text" value="1 Sep 2026, 00:00 EAT">
        </div>
        <div class="field" style="margin: 0;">
          <label>Closes at</label>
          <input class="input" type="text" value="25 Nov 2026, 23:59 EAT">
        </div>
      </div>
    </div>

    <div style="position: sticky; bottom: 0; left: 0; width: 1200px; background: var(--color-bg); border-top: 1px solid var(--color-neutral-200); padding: 16px 0; display: flex; align-items: center; justify-content: flex-end; margin-top: 16px;">
      <button class="btn btn-primary">Save window</button>
    </div>

  </div>
</div>

</x-dc>
</body>
</html>
