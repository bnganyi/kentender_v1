ius: 0; }\n  .kt-journey-check { stroke: CanvasText; }\n  .kt-journey-position { border-right-color: CanvasText; }\n  .kt-notice.is-warning.kt-next-step { border: 1px solid CanvasText; border-left-width: 3px; }\n}\n@media print {\n  .kt-journey-bar, .kt-journey-bars > span { background: #bbb !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }\n  .kt-journey-stage.is-done .kt-journey-bar, .kt-journey-stage.is-current .kt-journey-bar, .kt-journey-stage.is-blocked .kt-journey-bar,\n  .kt-journey-bars > .is-done, .kt-journey-bars > .is-current, .kt-journey-bars > .is-blocked { background: #000 !important; }\n  .kt-journey-title, .kt-journey-num, .kt-journey-state { color: #000 !important; }\n  .kt-next-step.is-turn, .kt-next-step.is-waiting, .kt-next-step.is-done { border-left-color: #000; }\n  .kt-journey.is-compact .kt-journey-bar { height: 0; border-top: 6px solid #bbb; background: none !important; }\n  .kt-journey.is-compact .is-done .kt-journey-bar, .kt-journey.is-compact .is-current .kt-journey-bar, .kt-journey.is-compact .is-blocked .kt-journey-bar { border-top-color: #000; }\n  .kt-journey.is-compact .kt-journey-state { position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal; padding-left: 0; }\n  .kt-journey-check { stroke: #000; }\n  .kt-journey-position-n, .kt-journey-position-of, .kt-journey-position-state, .kt-journey-position-label { color: #000 !important; }\n  .kt-notice.is-warning.kt-next-step { border-left: 3px solid #000; }\n}\n/* Dependent fields behind a Yes/No switch */\n.kt-choice-row { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 8px var(--space-6); align-items: center; padding: var(--space-3) 0; border-top: 1px solid var(--color-divider); }\n.kt-choice-label { font-size: 14px; font-weight: 500; }\n.kt-choice-row .seg { width: fit-content; }\n.kt-dependent { grid-column: 1 / -1; border-left: 2px solid var(--color-divider); padding: 4px 0 4px var(--space-4); margin-top: 4px; display: grid; gap: var(--space-3); }\n.kt-choice-row.is-stacked { grid-template-columns: minmax(0, 1fr); }\n/* Filter bar: controls local to the records they filter */\n.kt-filter-bar { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--space-3); align-items: end; margin-bottom: var(--space-4); }\n.kt-filter-bar > .is-wide { grid-column: span 2; }\n/* Inside a page sheet a disclosure is a rule band, not a nested card */\n.kt-page .kt-disclosure { border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; }\n/* Empty / filtered-empty inside the sheet */\n.kt-empty { padding: var(--space-8) var(--space-6); display: grid; justify-items: center; gap: var(--space-3); text-align: center; border-top: 1px solid var(--color-divider); color: var(--color-text); }\n.kt-empty p { margin: 0; max-width: 46ch; text-wrap: pretty; }\n.kt-topbar-avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--color-accent-900); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }\n\n/* ══ DS-REV-002 — visual language and warmth (KT-STD-001 v1.18 §2.6.11) ══ */\n/* Icons: Lucide at stroke 1.75, on currentColor. Sizes 16 / 20 / 24. */\n.kt-icon { width: 20px; height: 20px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }\n.kt-icon.is-sm { width: 16px; height: 16px; }\n.kt-icon.is-lg { width: 24px; height: 24px; }\n/* Icon chip: the area / module identity mark. Rust tint, rust-800 glyph (6.3:1). One chip per area. */\n.kt-icon-chip { width: 28px; height: 28px; flex: none; display: inline-grid; place-items: center; color: var(--color-neutral-700); } /* identity mark: glyph only, no fill (v1.22) */\n.kt-icon-chip .kt-icon { width: 16px; height: 16px; }\n.kt-icon-chip.is-lg { width: 36px; height: 36px; }\n.kt-icon-chip.is-lg .kt-icon { width: 20px; height: 20px; }\n.kt-tab .kt-icon { width: 16px; height: 16px; }\n.kt-tab:has(input:checked) .kt-icon { color: var(--color-accent); }\n/* Status chip may lead with an icon; the label always stays */\n.kt-status .kt-icon { width: 14px; height: 14px; stroke-width: 2; }\n.btn .kt-icon { width: 16px; height: 16px; }\n/* Region surface: the one warm tint, soft radius, no border */\n.kt-region-tint { padding-top: var(--space-5); border-top: 1px solid var(--color-divider); } /* name kept for markup compatibility: a region separated by a 1px rule, no fill (v1.22) */\n.kt-region-tint > h2, .kt-region-title { display: flex; align-items: center; gap: var(--space-3); margin: 0 0 var(--space-4); font-size: 17px; font-weight: 600; color: var(--color-heading); }\n/* Band: a full-width tinted strip of columns (summary strip) */\n.kt-band { display: grid; grid-template-columns: repeat(var(--kt-band-n, 5), minmax(0, 1fr)); border-top: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider); }\n.kt-band > * { padding: var(--space-5) var(--space-5) var(--space-5) 0; min-width: 0; display: grid; gap: var(--space-3); align-content: start; }\n.kt-band > * + * { border-left: 1px solid var(--color-divider); padding-left: var(--space-5); }\n/* Result figure: display size, tabular digits, deep indigo; plain sentence beneath at body size */\n.kt-result { display: grid; gap: 4px; }\n.kt-result-value { font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--color-figure); }\n.kt-result-value.is-md { font-size: 26px; }\n.kt-result-value small { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--color-neutral-700); margin-left: 4px; }\n.kt-result-text { margin: 0; font-size: 14px; color: var(--color-neutral-800); text-wrap: pretty; }\n/* Spot (illustration placeholder): icon in a tinted circle. Empty, success, first-use, error, access states only. */\n.kt-spot { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--color-divider); color: var(--color-accent-700); } /* outline only, no fill (v1.22) */\n.kt-spot .kt-icon { width: 32px; height: 32px; stroke-width: 1.5; }\n.kt-spot.is-neutral { color: var(--color-neutral-700); }\n.kt-spot.is-success { color: var(--status-live); }\n.kt-spot.is-error { color: var(--status-critical); }\n\n/* ── Charts (§2.6.10 forms). Light baseline, no heavy gridlines, every value as text, no motion. ── */\n.kt-chart { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-3); font-size: 13px; }\n.kt-chart-caption { margin: 0; font-size: 13px; color: var(--color-neutral-700); }\n.kt-legend { display: flex; flex-wrap: wrap; gap: 6px var(--space-5); font-size: 13px; color: var(--color-neutral-800); }\n.kt-legend > span { position: relative; display: inline-block; min-width: 0; padding-left: 16px; }\n.kt-legend b { white-space: nowrap; }\n.kt-legend > span::before { content: \"\"; position: absolute; left: 0; top: .42em; width: 10px; height: 10px; border-radius: 3px; background: var(--kt-swatch, var(--color-neutral-400)); box-shadow: var(--kt-swatch-edge, none); }\n.kt-legend b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-text); }\n/* Segmented bar: segments sized by inline flex-grow; a 2px gap separates them */\n.kt-seg { display: flex; gap: 2px; height: 12px; border-radius: 3px; overflow: hidden; }\n.kt-seg.is-lg { height: 20px; }\n.kt-seg > i { display: block; min-width: 3px; background: var(--kt-swatch, var(--color-neutral-400)); box-shadow: var(--kt-swatch-edge, none); }\n/* Horizontal bar rows: label | bar | value(s) */\n.kt-hbars { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: var(--space-3) var(--space-4); align-items: center; }\n.kt-hbars .kt-hbar-track { display: flex; align-items: center; gap: var(--space-2); border-left: 1px solid var(--data-baseline); padding: 3px 0; }\n.kt-hbars .kt-hbar-track > i { display: block; height: 14px; border-radius: 0 3px 3px 0; background: var(--kt-swatch, var(--color-neutral-400)); }\n.kt-hbars .kt-hbar-track > b, .kt-hbars .is-value { font-weight: 600; font-variant-numeric: tabular-nums; }\n.kt-hbars .is-value { text-align: right; white-space: nowrap; }\n/* Swatch roles — set --kt-swatch on a segment, bar or legend item */\n.is-cat-1 { --kt-swatch: var(--data-cat-1); } .is-cat-2 { --kt-swatch: var(--data-cat-2); } .is-cat-3 { --kt-swatch: var(--data-cat-3); }\n.is-cat-4 { --kt-swatch: var(--data-cat-4); } .is-cat-5 { --kt-swatch: var(--data-cat-5); } .is-cat-6 { --kt-swatch: var(--data-cat-6); }\n/* Light tones fall under 3:1 against the region, so they carry an inset edge in their family's dark step */\n.is-seq-1 { --kt-swatch: var(--data-seq-1); --kt-swatch-edge: inset 0 0 0 1px var(--data-seq-4); }\n.is-seq-2 { --kt-swatch: var(--data-seq-2); --kt-swatch-edge: inset 0 0 0 1px var(--data-seq-4); }\n.is-seq-3 { --kt-swatch: var(--data-seq-3); } .is-seq-4 { --kt-swatch: var(--data-seq-4); }\n.is-pair-strong { --kt-swatch: var(--data-pair-strong); }\n.is-pair-tint { --kt-swatch: var(--data-pair-tint); --kt-swatch-edge: inset 0 0 0 1px var(--data-pair-strong); }\n.is-family-1 { --kt-swatch: var(--data-family-1); } .is-family-2 { --kt-swatch: var(--data-family-2); }\n.is-family-3 { --kt-swatch: var(--data-family-3); --kt-swatch-edge: inset 0 0 0 1px var(--data-family-1); }\n/* Selected bar: accent ring, never a fill change */\n.kt-seg > i.is-selected, .kt-hbar-track > i.is-selected { outline: 2px solid var(--color-accent); outline-offset: 1px; }\n/* Range strip: shortest–longest line with median marker on a shared axis */\n.kt-range { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 3fr) repeat(4, minmax(64px, .55fr)); column-gap: 0; align-items: center; }\n.kt-range > :nth-child(6n+2) { padding-inline: var(--space-4); }\n.kt-range > .is-head { font-size: 12px; font-weight: 600; color: var(--color-neutral-700); padding-bottom: 6px; border-bottom: 1px solid var(--color-divider); }\n.kt-range > .is-cell { padding: 9px 0; border-bottom: 1px solid var(--color-divider); font-size: 13px; }\n.kt-range > .is-num { text-align: right; font-variant-numeric: tabular-nums; padding-left: var(--space-3); }\n.kt-range-track { position: relative; display: block; height: 20px; }\n.kt-range-track::before { content: \"\"; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--color-neutral-300); }\n.kt-range-line { position: absolute; top: calc(50% - 2px); height: 4px; border-radius: 2px; background: var(--data-seq-3); }\n.kt-range-median { position: absolute; top: 2px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--color-accent); }\n.kt-range-axis { position: relative; display: block; height: 16px; margin-top: 4px; font-size: 11px; color: var(--color-neutral-700); font-variant-numeric: tabular-nums; }\n.kt-range-axis > span { position: absolute; transform: translateX(-50%); }\n/* Vertical grouped bars by calendar period */\n.kt-vbars { display: grid; grid-template-columns: repeat(var(--kt-vbars-n, 12), minmax(0, 1fr)); column-gap: 4px; align-items: end; height: 120px; border-bottom: 1px solid var(--data-baseline); }\n.kt-vbars > div { display: flex; align-items: end; justify-content: center; gap: 2px; height: 100%; }\n.kt-vbars i { position: relative; display: block; width: 10px; border-radius: 3px 3px 0 0; background: var(--kt-swatch); }\n.kt-vbars i > b { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding-bottom: 2px; font-size: 11px; font-weight: 600; font-style: normal; font-variant-numeric: tabular-nums; }\n.kt-vbars-axis { display: grid; grid-template-columns: repeat(var(--kt-vbars-n, 12), minmax(0, 1fr)); column-gap: 4px; padding-top: 4px; line-height: 1.25; font-size: 11px; color: var(--color-neutral-700); text-align: center; }\n\n/* Motion: 200 ms ceiling; never on charts; off under reduced motion */\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; } }\n@media (forced-colors: active) {\n  .kt-seg > i, .kt-hbar-track > i, .kt-vbars i, .kt-legend > span::before { forced-color-adjust: none; border: 1px solid CanvasText; }\n  .kt-band { border-color: CanvasText; }\n}\n@media print {\n  .kt-band, .kt-region-tint, .kt-empty { border-color: #000; }\n  .kt-seg > i, .kt-hbar-track > i, .kt-vbars i, .kt-legend > span::before { print-color-adjust: exact; -webkit-print-color-adjust: exact; }\n}\n<\u002Fstyle>\n  <script src=\"efe494e6-e803-4b7e-8949-88ef781e79fa\"><\u002Fscript>\n  <style>body { margin: 0; background: var(--color-bg); } a { color: var(--color-accent-700); } a:hover { color: var(--color-accent-800); }<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh; background:var(--color-bg); padding:32px; box-sizing:border-box; font-family:var(--font-body); color:var(--color-text);\">\n  <div class=\"kt-page\" style=\"margin:0 auto; max-width:1120px; box-sizing:border-box; display:flex; flex-direction:column; gap:0;\">\n\n    <div class=\"kt-page-head\" style=\"padding-bottom:var(--space-6);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px; max-width:760px;\">\n        <h1 class=\"kt-page-title\">Record picker<\u002Fh1>\n        <p style=\"margin:0; font-size:14px; color:var(--color-text-muted); text-wrap:pretty;\">The thirteen behaviours of §3, each drawn in the state it describes. Wherever a reader chooses one person or one record from a list that can grow beyond about a dozen entries, they use the one picker. Item 8 is live: click into it and use the keyboard.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 14 Several members (approved) -->\n    <div id=\"14\" style=\"display:flex; flex-direction:column; gap:20px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px 48px;\">\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"display:flex; align-items:center; gap:10px;\"><h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">14 · Appointing several members<\u002Fh2><span class=\"kt-status is-live\">Approved 14 October 2026<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">Each member used to be one trip through the Add member dialog. Now there is one Add members dialog. The list stays open beside the field; choosing a row adds the person to <strong>To appoint<\u002Fstrong> and leaves the list, the search text and the reader's place where they were. An added row stays in the list, greyed, with \"Added to this list\". Each person's role is set in the list; one action appoints them all.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px; font-size:13px; line-height:1.5;\">\n          <div style=\"font-weight:600; color:var(--color-heading);\">Keyboard and announcements<\u002Fdiv>\n          <div style=\"color:var(--color-text-muted); text-wrap:pretty;\">Enter adds the active row and moves to the next choosable one. The search text is selected, so typing starts a new search; Esc clears the search, and a second Esc reaches the dialog. The live region says \"Added Amina Hassan. 3 to appoint.\" The command that appoints checks each person again (item 12) and returns a field error against that person's row.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"box-sizing:border-box; border:1px solid var(--color-divider); border-radius:var(--radius-lg); background:color-mix(in srgb, var(--color-neutral-900) 50%, var(--color-bg)); padding:32px; display:flex; justify-content:center;\">\n        <div class=\"dialog\" style=\"width:100%; max-width:900px; box-sizing:border-box; padding:var(--space-5); gap:var(--space-4);\" sc-camel-on-key-down=\"{{ onKeyArea14 }}\">\n          <div class=\"dialog-title\" style=\"color:var(--color-heading); font-size:18px;\">Add members<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:24px; align-items:start;\">\n            <div class=\"field\"><label for=\"p14\">Find people<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p14\" inline=\"{{ true }}\" multiple=\"{{ true }}\" list-max=\"360px\" taken=\"{{ taken }}\" staged=\"{{ stagedIds }}\" on-add=\"{{ onAdd }}\" hint-size=\"100%,400px\"><\u002Fdc-import><\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:8px; min-width:0;\">\n              <div style=\"font-size:13px; font-weight:600; color:var(--color-heading);\">{{ stagedTitle }}<\u002Fdiv>\n              <sc-if value=\"{{ noneStaged }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:16px 0; border-top:1px solid var(--color-divider); font-size:13px; color:var(--color-text-muted);\">People you choose appear here.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ someStaged }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex; flex-direction:column; max-height:360px; overflow-y:auto; border-top:1px solid var(--color-divider);\">\n                  <sc-for list=\"{{ stagedRows }}\" as=\"m\" hint-placeholder-count=\"0\">\n                    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 128px auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--color-divider);\">\n                      <div style=\"display:flex; flex-direction:column; gap:1px; min-width:0;\">\n                        <span style=\"font-size:14px; font-weight:600; color:var(--color-heading);\">{{ m.label }}<\u002Fspan>\n                        <span style=\"font-size:12px; color:var(--color-text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ m.detail }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <sc-raw-select class=\"input\" aria-label=\"{{ m.roleLabel }}\" value=\"{{ m.role }}\" sc-camel-on-change=\"{{ m.onRole }}\" style=\"height:32px; font-size:13px;\"><option value=\"Member\">Member<\u002Foption><option value=\"Secretary\">Secretary<\u002Foption><\u002Fsc-raw-select>\n                      <button type=\"button\" class=\"btn btn-ghost\" aria-label=\"{{ m.removeLabel }}\" sc-camel-on-click=\"{{ m.onRemove }}\" style=\"height:32px; padding:0 8px; font-size:13px;\">Remove<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"dialog-actions\" style=\"align-items:center;\">\n            <span role=\"status\" style=\"margin-right:auto; font-size:12px; color:var(--color-text-muted);\">{{ appointNote }}<\u002Fspan>\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onCancel14 }}\">Cancel<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-primary\" disabled=\"{{ noneStaged }}\" sc-camel-on-click=\"{{ onAppoint }}\">{{ appointLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1 Shape -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">1 · Shape<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">A single field that looks like the Industry text field with a search icon. The reader types to search; a list opens beneath it. A chosen record shows as its name inside the field with a \"Clear\" control, and the list is not drawn while a record is chosen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <div class=\"field\"><label for=\"p1a\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p1a\" hint-size=\"100%,36px\"><\u002Fdc-import><\u002Fdiv>\n        <div class=\"field\"><label for=\"p1b\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p1b\" value=\"amina.hassan\" value-label=\"Amina Hassan\" hint-size=\"100%,36px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2 Search -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">2 · Search<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">Matches the record's name, its one-line detail (for a person: designation and department) and any extra keywords the source supplies (for a person: login). Matching is by word start, ignoring case and accents. Search starts after the reader stops typing for about a quarter of a second. A new character never leaves the old list standing as if it answered the new text; the list marks itself as updating and is replaced when the answer arrives.<\u002Fp>\n        <p style=\"margin:0; font-size:12px; color:var(--color-text-muted);\">Drawn: the answer for “ami” is still on screen after the reader typed “amina”. Its rows are greyed, unhighlighted and cannot be chosen until the new answer replaces them.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p2\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p2\" frozen-open=\"{{ true }}\" frozen-query=\"amina\" frozen-prev-query=\"ami\" frozen-state=\"updating\" static-list=\"{{ true }}\" list-max=\"300px\" hint-size=\"100%,340px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3 Results -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">3 · Results<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">At most 20 rows. Each row has the name in strong type, the detail beneath it, and the matched text emphasised. When more matched than are shown, the last line reads \"Showing 20 of 143. Keep typing to narrow.\" Ranking: name starts with the text, then a word of the name starts with it, then the detail or keywords contain it; ties broken by name.<\u002Fp>\n        <p style=\"margin:0; font-size:12px; color:var(--color-text-muted);\">Drawn: “a”, scrolled to the foot line.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p3\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p3\" frozen-open=\"{{ true }}\" frozen-query=\"a\" frozen-scroll=\"end\" static-list=\"{{ true }}\" list-max=\"340px\" taken=\"{{ taken }}\" hint-size=\"100%,380px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 4 Before typing -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">4 · Before typing<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">Focusing an empty picker opens a list in three parts, in this order: <strong>Your department<\u002Fstrong> (people whose department is the reader's own; records the source marks as near the reader), <strong>Recent<\u002Fstrong> (the last five the reader chose from this source, excluding any already shown), then <strong>Everyone else<\u002Fstrong> in name order. Each part has a small heading and is left out when empty. A reader with no recorded department sees Recent, then Everyone else.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p4\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p4\" frozen-open=\"{{ true }}\" frozen-query=\"\" static-list=\"{{ true }}\" list-max=\"420px\" taken=\"{{ taken }}\" hint-size=\"100%,460px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 5 Not available -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">5 · Not available is shown, not hidden<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">A row that cannot be chosen stays in the list, greyed, with the reason on its second line (\"Already on this committee\", \"Was involved in processing this Tender\"). Arrow keys skip it; clicking it does nothing. The reason is the source's own wording.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p5\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p5\" frozen-open=\"{{ true }}\" frozen-query=\"che\" static-list=\"{{ true }}\" list-max=\"320px\" taken=\"{{ taken5 }}\" hint-size=\"100%,360px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 6 Nothing found -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">6 · Nothing found<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">\"No person matches 'xyz'.\" When the source can say why (for example, only people holding a certain responsibility can be named here), one further line says so.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p6\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p6\" frozen-open=\"{{ true }}\" frozen-query=\"xyz\" static-list=\"{{ true }}\" hint-size=\"100%,130px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7 Failure -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">7 · Failure<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">If the search cannot be answered, the list says \"Could not load people. Try again.\" with a Try again button. It does not raise Frappe's Message dialog, and it does not clear what the reader has already chosen.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p7\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p7\" frozen-open=\"{{ true }}\" frozen-query=\"ami\" frozen-state=\"error\" static-list=\"{{ true }}\" hint-size=\"100%,130px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 8 Keyboard (live) -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">8 · Keyboard<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">Down and Up move through the choosable rows; Enter chooses; Esc closes the list and <strong>only<\u002Fstrong> the list (inside a dialog, a second Esc closes the dialog); Tab chooses nothing and moves on; typing anywhere in the field searches. Home and End go to the first and last row.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; align-items:center; font-size:13px;\">\n          <sc-for list=\"{{ keys }}\" as=\"k\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex; gap:4px;\"><sc-for list=\"{{ k.caps }}\" as=\"c\" hint-placeholder-count=\"1\"><span style=\"display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; padding:0 6px; border:1px solid var(--color-control-border); border-radius:var(--radius-control); font-size:12px; font-weight:600; color:var(--color-heading); white-space:nowrap;\">{{ c }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <span style=\"color:var(--color-text-muted);\">{{ k.does }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:10px; min-height:420px;\" sc-camel-on-key-down=\"{{ onKeyArea }}\">\n        <div class=\"field\"><label for=\"p8\">Member · live<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p8\" taken=\"{{ taken }}\" fail=\"{{ simulateFailure }}\" latency=\"{{ latency }}\" on-change=\"{{ onLive }}\" hint-size=\"100%,36px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--color-text-muted); min-height:16px;\">{{ liveNote }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 9 Assistive technology -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">9 · Assistive technology<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">The field is a combobox in the standard ARIA 1.2 pattern: it announces whether the list is open, which row is active, and, in a polite live region, \"12 results\" or \"No person matches\". An unavailable row's reason is part of its accessible description. Clear has a full name (\"Clear Amina Hassan\").<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:0;\">\n        <sc-raw-table class=\"table\" style=\"font-size:13px;\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Element<\u002Fsc-raw-th><sc-raw-th>Announced<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ aria }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <sc-raw-tr><sc-raw-td style=\"color:var(--color-heading); white-space:nowrap;\">{{ a.el }}<\u002Fsc-raw-td><sc-raw-td style=\"color:var(--color-text-muted);\">{{ a.says }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 10 Narrow -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">10 · Narrow screens<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">The list is as wide as the field and rows are at least 44 px tall. The list never extends past the viewport; it opens upward when there is no room beneath.<\u002Fp>\n        <p style=\"margin:0; font-size:12px; color:var(--color-text-muted);\">Drawn: Add member dialog at 390 px, field near the bottom of the screen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"width:390px; max-width:100%; height:660px; box-sizing:border-box; border:1px solid var(--color-divider); border-radius:var(--radius-lg); background:color-mix(in srgb, var(--color-neutral-900) 50%, var(--color-bg)); display:flex; flex-direction:column; justify-content:flex-end; padding:12px; overflow:hidden;\">\n        <div class=\"dialog\" style=\"width:100%; box-sizing:border-box; padding:var(--space-5); gap:var(--space-3);\">\n          <div class=\"dialog-title\" style=\"color:var(--color-heading); font-size:18px;\">Add member<\u002Fdiv>\n          <div class=\"field\"><label for=\"p10\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p10\" frozen-open=\"{{ true }}\" frozen-query=\"wan\" static-list=\"{{ true }}\" place-up=\"{{ true }}\" list-max=\"360px\" taken=\"{{ taken }}\" hint-size=\"100%,400px\"><\u002Fdc-import><\u002Fdiv>\n          <div class=\"dialog-actions\">\n            <button type=\"button\" class=\"btn btn-secondary\">Cancel<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-primary\">Add member<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 11 Required and invalid -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">11 · Required and invalid<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">The field accepts the standard <code>invalid<\u002Fcode> and required marks. The error text is the screen's inline field error (AGENTS.md §6.10), never a dialog.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p11\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p11\" invalid=\"{{ true }}\" required=\"{{ true }}\" error-text=\"Choose a member.\" hint-size=\"100%,56px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 12 Not the authority -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">12 · What it is not<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">It is not the authority for who may be chosen. The command that saves the choice checks again and refuses an ineligible one with a field error.<\u002Fp>\n        <p style=\"margin:0; font-size:12px; color:var(--color-text-muted);\">Drawn: a saved choice the command refused on save. The wording is the command's own.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"p12\">Member<\u002Flabel><dc-import name=\"RecordPicker\" source=\"people\" input-id=\"p12\" value=\"kevin.mwangi\" value-label=\"Kevin Mwangi\" invalid=\"{{ true }}\" required=\"{{ true }}\" error-text=\"Was involved in processing this Tender.\" hint-size=\"100%,56px\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 13 Where it does not apply -->\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,460px); gap:32px 48px; padding:var(--space-6) 0 0; border-top:1px solid var(--color-divider);\">\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <h2 style=\"margin:0; font-size:17px; font-weight:600; color:var(--color-heading);\">13 · Where it does not apply<\u002Fh2>\n        <p style=\"margin:0; font-size:14px; line-height:1.5; text-wrap:pretty;\">Choices from a short fixed vocabulary (a role on a committee, a country, a status) stay plain selects. A choice made from a handful of people already on the screen (who read the minutes aloud) stays a select.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <div class=\"field\"><label for=\"p13a\">Role on committee<\u002Flabel>\n          <sc-raw-select class=\"input\" id=\"p13a\"><option>Member<\u002Foption><option>Secretary<\u002Foption><\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div class=\"field\"><label for=\"p13b\">Read aloud by<\u002Flabel>\n          <sc-raw-select class=\"input\" id=\"p13b\"><option>Joyce Abdi<\u002Foption><option>Peter Otieno<\u002Foption><option>Naomi Wekesa<\u002Foption><\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;simulateFailure&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Live picker (item 8)&quot;},&quot;latency&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:300,&quot;min&quot;:0,&quot;max&quot;:2000,&quot;step&quot;:50,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Live picker (item 8)&quot;}}\">\nclass Component extends DCLogic {\n  state = { note: '', staged: [], appointed: '' };\n  renderVals() {\n    const st = this.state.staged; const n = st.length;\n    const setRole = (id, role) => this.setState((s) => ({ staged: s.staged.map((m) => m.id === id ? Object.assign({}, m, { role }) : m) }));\n    return {\n      stagedIds: st.map((m) => m.id),\n      noneStaged: n === 0, someStaged: n > 0,\n      stagedTitle: n ? 'To appoint · ' + n : 'To appoint',\n      appointLabel: n === 0 ? 'Appoint members' : n === 1 ? 'Appoint 1 member' : 'Appoint ' + n + ' members',\n      appointNote: this.state.appointed,\n      stagedRows: st.map((m) => ({\n        label: m.label, detail: m.detail, role: m.role,\n        roleLabel: 'Role for ' + m.label, removeLabel: 'Remove ' + m.label,\n        onRole: (e) => setRole(m.id, e.target.value),\n        onRemove: () => this.setState((s) => ({ staged: s.staged.filter((x) => x.id !== m.id) })),\n      })),\n      onAdd: (row) => this.setState((s) => s.staged.some((m) => m.id === row.id) ? null : ({ appointed: '', staged: s.staged.concat({ id: row.id, label: row.label, detail: row.detail, role: 'Member' }) })),\n      onAppoint: () => this.setState((s) => ({ appointed: s.staged.length + (s.staged.length === 1 ? ' member' : ' members') + ' appointed. In the product the dialog closes here.', staged: [] })),\n      onCancel14: () => this.setState({ staged: [], appointed: 'Cancelled. Nothing was appointed.' }),\n      onKeyArea14: (e) => { if (e.key === 'Escape') this.setState({ appointed: 'Esc reached the dialog: here it would close.' }); },\n      taken: ['joyce.abdi', 'peter.otieno'],\n      taken5: ['joyce.abdi', 'peter.otieno', 'faith.chebet'],\n      simulateFailure: !!this.props.simulateFailure,\n      latency: this.props.latency ?? 300,\n      liveNote: this.state.note,\n      onLive: (row) => this.setState({ note: row ? 'Chose ' + row.label + '.' : 'Cleared.' }),\n      onKeyArea: (e) => { if (e.key === 'Escape') this.setState({ note: 'Second Esc reached the dialog: here it would close.' }); },\n      keys: [\n        { caps: ['↓', '↑'], does: 'Move through choosable rows; unavailable rows are skipped' },\n        { caps: ['Enter'], does: 'Choose the active row' },\n        { caps: ['Esc'], does: 'Close the list only; a second Esc closes the dialog' },\n        { caps: ['Tab'], does: 'Choose nothing and move on' },\n        { caps: ['Home', 'End'], does: 'First and last row' },\n        { caps: ['a–z'], does: 'Search' },\n      ],\n      aria: [\n        { el: 'Field', says: 'Member, combobox, collapsed / expanded' },\n        { el: 'Active row', says: 'Brian Achieng, Procurement Officer · Supply Chain Management' },\n        { el: 'Live region', says: '“12 results” · “No person matches xyz”' },\n        { el: 'Unavailable row', says: 'Peter Otieno, dimmed. Already on this committee' },\n        { el: 'Clear', says: 'Clear Amina Hassan, button' },\n        { el: 'Invalid field', says: 'Member, invalid entry, required. Choose a member.' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
