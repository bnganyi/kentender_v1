document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<script src=\"5e0a96fb-328f-4262-b0a8-d67823eb4785\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <meta name=\"design_doc_mode\" content=\"canvas\">\n  <style>/* Industry — design-system tokens and component classes (DS-REV-002, surfaces per KT-STD-001 v1.22 §2.4). Source of truth; see readme.md. */\n/* Inter — Frappe's own font (--font-stack). Frappe Desk already loads it; these faces exist only so\n   design-system previews render outside Desk. SIL OFL 1.1 (assets/fonts/OFL-inter.txt). */\n@font-face{font-family:\"InterVariable\";font-style:normal;font-weight:100 900;font-display:swap;src:url(\"a69fdbf4-2191-4b2c-babd-4832f1b4b3ad\") format(\"woff2-variations\");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}\n@font-face{font-family:\"InterVariable\";font-style:normal;font-weight:100 900;font-display:swap;src:url(\"26a7adce-4163-4098-91e2-e2b99b14ef3c\") format(\"woff2-variations\");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}\n\n:root {\n  /* Surfaces, controls, text, radii and font are Frappe v16's own variables (KT-STD-001 v1.22 §2.4).\n     KenTender reads them and sets none of them; the fallback after each comma is the verified\n     version-16 value (commit 97a5dd9) so previews outside Desk match. */\n  --color-bg: var(--gray-50, #f8f8f8);           /* @kind color */ /* page ground behind the sheet */\n  --color-surface: var(--fg-color, #ffffff);     /* @kind color */ /* the one sheet, cards, dialogs */\n  --color-divider: var(--border-color, #ededed); /* @kind color */ /* sheet border, section rules, table rules */\n  --color-control: var(--control-bg, #f3f3f3);   /* @kind color */ /* input fill */\n  --color-control-disabled: var(--disabled-control-bg, #f8f8f8);     /* @kind color */ /* read-only value (.like-disabled-input), with --color-control-disabled-text */\n  --color-input-disabled: var(--input-disabled-bg, #ededed);         /* @kind color */ /* disabled or readonly <input>/<button> ($input-disabled-bg), with --color-text-muted */\n  --color-control-disabled-text: var(--disabled-text-color, #7c7c7c); /* @kind color */\n  --color-control-border: #8590a6;                           /* @kind color */ /* DS-REV-006: blue-grey 1px outline of fields, segmented control and secondary buttons, 3.21:1 on white (was var(--gray-600, #7c7c7c)) */\n  --color-control-border-hover: #6b7690;                     /* @kind color */ /* DS-REV-006: hover outline of .input and .btn-secondary, 4.55:1 on white */\n  --color-control-border-disabled: var(--gray-400, #c7c7c7); /* @kind color */ /* DS-REV-003: 1px outline of disabled buttons and fields */\n  --color-text: var(--text-color, #383838);       /* @kind color */\n  --color-heading: var(--heading-color, #171717); /* @kind color */\n  --color-text-muted: var(--text-muted, #525252); /* @kind color */\n  --color-figure: #1b2c68;    /* accent-800: key result figures (proposal; accent not yet approved) */\n  --color-accent: #2b46b0;    /* royal indigo — actions, selection, focus (proposal) */\n  --color-accent-2: #d9691a;  /* rust — identity marks only (proposal) */\n\n  /* Data colour roles — charts only (proposal; not approved by v1.22). */\n  --data-cat-1: #007979; --data-cat-2: #a23e7c; --data-cat-3: #3e8ec1; --data-cat-4: #674698; --data-cat-5: #4f5d75; --data-cat-6: #a3609f;\n  --data-seq-1: #bce8ea; --data-seq-2: #7abfc3; --data-seq-3: #2c898e; --data-seq-4: #005860;\n  --data-pair-strong: #233784; --data-pair-tint: #c4cdf5;\n  --data-family-1: #1b2c68; --data-family-2: #4c63cb; --data-family-3: #c4cdf5;\n  --data-baseline: var(--gray-600, #7c7c7c); /* @kind color */\n  --chart-1: #0891b2; --chart-2: #ea580c; --chart-3: #65a30d; --chart-4: #c026d3; --chart-5: #5a5ce2; --chart-6: #b77c00;\n\n  --status-live: #047857;      --status-live-bg: #e7f8f2;\n  --status-draft: #003d9b;     --status-draft-bg: #e6eefa;\n  --status-pending: #434654;   --status-pending-bg: #f1f1f3;\n  --status-attention: #92610a; --status-attention-bg: #fdf0da;\n  --status-critical: #b0143a;  --status-critical-bg: #fce8ec;\n\n  /* Neutrals = Frappe's gray ramp */\n  --color-neutral-100: var(--gray-100, #f3f3f3); /* @kind color */\n  --color-neutral-200: var(--gray-200, #ededed); /* @kind color */\n  --color-neutral-300: var(--gray-300, #e2e2e2); /* @kind color */\n  --color-neutral-400: var(--gray-400, #c7c7c7); /* @kind color */\n  --color-neutral-500: var(--gray-500, #999999); /* @kind color */\n  --color-neutral-600: var(--gray-600, #7c7c7c); /* @kind color */\n  --color-neutral-700: var(--gray-700, #525252); /* @kind color */\n  --color-neutral-800: var(--gray-800, #383838); /* @kind color */\n  --color-neutral-900: var(--gray-900, #171717); /* @kind color */\n\n  --color-accent-100: #e5e9fb; --color-accent-200: #c4cdf5; --color-accent-300: #98a6ee; --color-accent-400: #6d80e6; --color-accent-500: #4c63cb;\n  --color-accent-600: #2b46b0; --color-accent-700: #233784; --color-accent-800: #1b2c68; --color-accent-900: #131f4a;\n  --color-accent-2-100: #faede4; --color-accent-2-200: #f4d5bf; --color-accent-2-300: #ecb48d; --color-accent-2-400: #e4965f; --color-accent-2-500: #df803c;\n  --color-accent-2-600: #d9691a; --color-accent-2-700: #ad5314; --color-accent-2-800: #8a4310; --color-accent-2-900: #66320c;\n\n  --font-heading: var(--font-stack, \"InterVariable\", \"Inter\", system-ui, sans-serif); /* @kind font */\n  --font-heading-weight: 600;\n  --font-body: var(--font-stack, \"InterVariable\", \"Inter\", system-ui, sans-serif);    /* @kind font */\n\n  --space-1: 3.4px; --space-2: 6.8px; --space-3: 10.2px; --space-4: 13.6px; --space-5: 17px; --space-6: 20.4px; --space-8: 27.2px;\n\n  --radius-sm: var(--border-radius-tiny, 4px); /* @kind radius */ /* tags, checkboxes */\n  --radius-md: 4px;                            /* @kind radius */ /* DS-REV-005: was var(--border-radius, 8px); legacy, prefer --radius-lg */\n  --radius-control: 2px;                       /* @kind radius */ /* DS-REV-003/006: buttons, segmented control, notice banners */\n  --radius-field: 4px;                         /* @kind radius */ /* DS-REV-006: inputs, selects, textareas, date field — matches the 4px containers */\n  --radius-lg: 4px;                            /* @kind radius */ /* DS-REV-005: sheet, cards, dialogs, panels (was var(--border-radius-lg, 12px)) */\n  --radius-xl: var(--radius-lg);               /* @kind radius */ /* legacy alias of --radius-lg */\n\n  --motion-fast: 120ms; /* @kind other */\n  --motion-base: 180ms; /* @kind other */\n  --ease-standard: cubic-bezier(.2, 0, 0, 1); /* @kind other */\n\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .06);\n  --shadow-md: 0 3px 10px rgba(0, 0, 0, .08);\n  --shadow-lg: 0 12px 32px rgba(0, 0, 0, .14); /* dialogs only */\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint { position: relative; border-radius: var(--radius-lg); overflow: hidden; } /* figure frame: soft corners, no hairline */\n.duotone{position:relative;overflow:hidden}\n/* mix-blend-mode:color keeps the photo's own luminance, so the wash alone\n   wouldn't track the whiter page — lift the source a touch so images sit\n   with the new ground instead of anchoring the old grey. */\n.duotone img{filter:brightness(1.05) contrast(.97)}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 14px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.2; letter-spacing: 0; margin: 0 0 var(--space-2); color: var(--color-heading);\n}\nh1 { font-size: 32px; }\nh2 { font-size: 24px; }\nh3 { font-size: 20px; }\nh4 { font-size: 17px; }\nh5 { font-size: 15px; }\nh6 { font-size: 13px; }\nh6 { font-weight: 600; } /* sentence case: KT-STD-001 §2.6.7 bars uppercase / letter-spaced section titles */\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent-700); text-underline-offset: 3px; } /* links are indigo; rust is identity and tints only */\na:hover { color: var(--color-accent-900); }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: var(--color-neutral-700);\n}\n.text-muted { color: var(--color-neutral-700); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-control);\n}\n.btn svg { display: block; }\n/* Disabled state: see the rule after .btn-danger (it must follow every variant). */\n.btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }\n.btn-primary:hover { background: var(--color-accent-800); border-color: var(--color-accent-800); }\n.btn-primary:active { background: var(--color-accent-900); border-color: var(--color-accent-900); }\n/* DS-REV-003: outlined, no resting fill. Grey appears only on hover / press. */\n.btn-secondary { background: var(--color-surface); border-color: var(--color-control-border); color: var(--color-text); }\n.btn-secondary:hover { background: var(--color-neutral-100); border-color: var(--color-control-border-hover); }\n.btn-secondary:active { background: var(--color-neutral-200); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: var(--color-accent-100); }\n.btn-ghost:active { background: var(--color-accent-200); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: var(--color-neutral-800);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface); /* DS-REV-003: white field, outlined (was --color-control fill, no border) */\n  border: 1px solid var(--color-control-border); border-radius: var(--radius-field);\n}\n.input:hover:not(:disabled):not(:focus-visible) { border-color: var(--color-control-border-hover); }\n.input:focus-visible { outline-offset: 0; }\n.input:disabled, .input[readonly] {\n  color: var(--color-text-muted); /* KT-STD-001 v1.25 §2.4: disabled/read-only keep the grey fill and muted text, no outline */\n  background: var(--color-input-disabled);\n  border-color: transparent;\n}\n/* Editable table rows follow Frappe v16 common/grid.scss (.grid-body .editable-row):\n   --control-bg: var(--neutral) → white fill; --input-disabled-bg: var(--gray-50); controls square, no border.\n   Buttons in rows are the outlined .btn-secondary (DS-REV-003). Cell inputs stay borderless: the cell rules frame them. */\n.table td .input { background: var(--neutral, #ffffff); border: 0; border-radius: 0; }\n.table td .input:disabled, .table td .input[readonly] { background: var(--color-control-disabled); }\ntextarea.input { min-height: 90px; resize: vertical; }\n.date-field {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px;\n  color: var(--color-text); background: var(--color-surface);\n  border: 1px solid var(--color-control-border); border-radius: var(--radius-field);\n  display: flex; align-items: center; justify-content: space-between; gap: 8px;\n}\n.date-field:hover:not([aria-disabled=\"true\"]):not(:focus-within) { border-color: var(--color-control-border-hover); } /* DS-REV-006 addendum, approved by the Project Owner 9 October 2026: date field shares the field hover edge */\n.date-field svg { flex: none; color: var(--color-neutral-600); }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-surface);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  background: var(--color-surface); /* white track on the grey ground */\n  border: 1px solid var(--color-control-border); border-radius: var(--radius-control);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: #fff; }\n.seg-opt:not(:has(input:checked)):hover { background: var(--color-neutral-100); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 12px; font-weight: 600; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; color: var(--color-neutral-800); flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: var(--color-neutral-700);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; white-space: nowrap; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-200); color: var(--color-neutral-800); } /* 200: 100 vanishes on white cards */\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 13px; font-weight: 600;\n  color: var(--color-neutral-700);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: var(--color-neutral-100); }\n/* Numeric columns in registers: right-aligned, non-jittering digits */\n.table .is-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }\n/* True zeros recede so real amounts pop — a young fiscal year is full of them */\n.table .is-num.is-zero, .kt-figure.is-zero { color: var(--color-neutral-500); font-weight: 400; }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  z-index: 10; /* above sticky .table thead th (z-index 1) so a dimmed parent doesn't leak header bands */\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(520px, 100%); /* KT-STD-001 §2.2 */ display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; color: var(--color-neutral-800); }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — shape (DS-REV-002): soft radii, tone before lines — */\n.btn, .seg { border-radius: var(--radius-control); } /* DS-REV-003: controls are rectangular; status chips and cards stay soft */\n.input, .date-field { border-radius: var(--radius-field); } /* DS-REV-006: fields match the 4px containers they sit in */\n.tag { border-radius: var(--radius-sm); }\n.card { border-radius: var(--radius-lg); background: var(--color-surface); border: 1px solid var(--color-divider); }\n.dialog { border-radius: var(--radius-lg); }\n.btn { transition: background-color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard); }\n\n/* ── KenTender extensions (status semantics, header emphasis, section titles) ── */\n/* KenTender status semantics.\n   Chip form borrowed from the KenTender Decision System: full pill, tinted fill at ~10%\n   of the status hue, text at full strength, no hard border. Palette is the\n   \"dynamic guardrail\" trio (emerald / amber / rose) plus indigo and institutional blue. */\n.kt-status {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  white-space: nowrap;\n  font-family: var(--font-body);\n  font-size: 13px;\n  font-weight: 600;\n  line-height: 1.5;\n  letter-spacing: .01em;\n  padding: 4px 12px;\n  border: 0;\n  border-radius: 6px;\n  white-space: nowrap;\n}\n.kt-status::before {\n  content: \"\";\n  width: 7px;\n  height: 7px;\n  border-radius: 50%;\n  background: currentColor;\n  flex: none;\n}\n\n/* Live — in force now: Active, Available, Ready (Emerald) */\n.kt-status.is-live { background: var(--status-live-bg); color: var(--status-live); }\n\n/* Draft — authored, not submitted (institutional blue) */\n.kt-status.is-draft { background: var(--status-draft-bg); color: var(--status-draft); }\n\n/* Pending — awaiting evaluation: Not assessed (neutral) */\n.kt-status.is-pending { background: var(--status-pending-bg); color: var(--status-pending); }\n.kt-status.is-pending::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }\n\n/* Attention — action needed: Configuration required (Amber) */\n.kt-status.is-attention { background: var(--status-attention-bg); color: var(--status-attention); }\n\n/* Critical — stopped or removed: Suspended, Closed (Rose) */\n.kt-status.is-critical { background: var(--status-critical-bg); color: var(--status-critical); }\n\n/* Table + section header emphasis */\n.table thead th {\n  position: sticky; top: 0; z-index: 1;\n  background: transparent;\n  font-family: var(--font-heading);\n  font-weight: var(--font-heading-weight);\n  font-size: 13px;\n  color: var(--color-text);\n  border-bottom: 2px solid color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n\n/* Denser row rhythm for data-heavy registers: tighten vertical padding, keep horizontal */\n.table th, .table td { padding: 4px 16px; }\n\n/* Summary-card figures — same semantic tones as the chips */\n.kt-figure { display: inline-flex; align-items: center; gap: 12px; }\n.kt-figure.is-live { color: var(--status-live); }\n.kt-figure.is-attention { color: var(--status-attention); }\n\n.kt-card-title {\n  font-family: var(--font-heading);\n  font-weight: var(--font-heading-weight);\n  font-size: 16px;\n  color: var(--color-heading);\n  margin: 0 0 12px;\n}\n\n/* Caption label — the small caption under a figure or beside a value (e.g. \"Drawdown lines\",\n   \"Plan Item\"). Opacity-dimmed text at 11px fails contrast on this ground (~2.5:1); this uses\n   a solid neutral-ramp step instead, plus weight, so captions stay legible next to bold values. */\n.kt-label {\n  font-size: 11px;\n  font-weight: 600;\n  color: var(--color-neutral-700);\n}\n\n/* Destructive action — Withdraw bid, Delete draft. Derived from the rose\n   status hue: destruction IS state semantics, so this stays inside the\n   \"no color beyond steel except to encode state\" rule. Pair with a\n   .btn-secondary cancel, never two danger buttons in one row. */\n.btn-danger, .btn-primary.kt-danger { background: var(--status-critical); border-color: var(--status-critical); color: #fff; }\n.btn-danger:hover, .btn-primary.kt-danger:hover { background: #8f102f; border-color: #8f102f; }\n.btn-danger:active, .btn-primary.kt-danger:active { background: #700c25; border-color: #700c25; }\n.btn-danger:focus-visible, .btn.kt-danger:focus-visible { outline-color: var(--status-critical); }\n/* Secondary danger: red text, red 1px outline on white; red tint on hover; text and outline step darker on press */\n.btn-secondary.kt-danger { background: var(--color-surface); border-color: var(--status-critical); color: var(--status-critical); }\n.btn-secondary.kt-danger:hover { background: var(--status-critical-bg); }\n.btn-secondary.kt-danger:active { background: var(--status-critical-bg); border-color: #8f102f; color: #8f102f; }\n.btn-ghost.kt-danger { color: var(--status-critical); }\n.btn-ghost.kt-danger:hover { background: var(--status-critical-bg); }\n.btn-ghost.kt-danger:active { background: var(--status-critical-bg); color: #8f102f; }\n/* Disabled (DS-REV-003): muted text, lighter 1px outline, no fill — every variant, including primary\n   and danger, so it still reads as a button. Ghost has no outline at rest and keeps none. */\n.btn:disabled, .btn:disabled:hover, .btn:disabled:active {\n  cursor: not-allowed;\n  color: var(--color-control-disabled-text);\n  background: transparent;\n  border-color: var(--color-control-border-disabled);\n}\n.btn-ghost:disabled, .btn-ghost:disabled:hover, .btn-ghost:disabled:active { border-color: transparent; }\n\n/* Figure semantics are CONDITIONAL, never column labels: a neutral figure\n   carries no dot; a figure takes is-live / is-attention / is-critical when\n   the VALUE crosses a threshold (e.g. Available headroom healthy / low /\n   exhausted). Thresholds are business logic, set at implementation. */\n.kt-figure.is-critical { color: var(--status-critical); }\n\n/* Utilization bar — one record's part-to-whole (committed / reserved /\n   free), drawn from the steel ramp. Not a chart: --chart-* stays out.\n   <div class=\"kt-bar\"><i class=\"kt-bar-committed\" style=\"width:0%\"><\u002Fi>\n   <i class=\"kt-bar-reserved\" style=\"width:50%\"><\u002Fi><\u002Fdiv> */\n.kt-bar { display: flex; height: 6px; background: var(--color-neutral-200); overflow: hidden; }\n.kt-bar > i { display: block; height: 100%; }\n.kt-bar-committed { background: var(--color-accent-800); }\n.kt-bar-reserved { background: var(--color-accent-400); }\n\n/* Windows High Contrast / forced colors: tinted fills collapse to one\n   background, so shape must carry what tint no longer can. Text labels on\n   chips remain the primary channel for state. */\n@media (forced-colors: active) {\n  .kt-status, .tag { border: 1px solid currentColor; }\n  .kt-status.is-pending::before { box-shadow: none; border: 1.5px solid currentColor; }\n}\n\n/* Print — tender summaries and confirmations WILL be printed. Ink-safe:\n   black text, hairlines kept, chrome and actions dropped. */\n@media print {\n  body { background: #fff; color: #000; }\n  .nav, .btn, .dialog-backdrop, .seg { display: none; }\n  .card, .dialog, .elev-sm, .elev-md, .elev-lg { box-shadow: none; }\n  .card, .dialog { background: #fff; border-color: #000; }\n  .kt-status { background: none; color: #000; border: 1px solid #000; }\n  a { color: #000; }\n  .table thead th { position: static; border-bottom-color: #000; }\n  .kt-page { box-shadow: none; border-color: #000; margin: 0; }\n}\n\n/* iOS Safari auto-zooms fields under 16px — a meaningful share of bidders\n   are on phones, so inputs step up on narrow viewports. */\n@media (max-width: 480px) {\n  .input, .date-field { font-size: 16px; }\n}\n\n/* ── Signal Indigo handoff: fixes to existing rules ── */\n/* Figure/status/KPI dots removed entirely, system-wide — not conditional. */\n.kt-figure::after { content: none !important; disclosure-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 15px; }\n.kt-disclosure-chevron { color: var(--color-accent-700); flex-shrink: 0; transition: transform var(--motion-base) var(--ease-standard); }\n.kt-disclosure-chevron.is-open { transform: rotate(180deg); }\n.kt-disclosure-body { border-top: 1px solid var(--color-divider); padding: var(--space-4); }\n\n/* ── New component: decision timeline ── */\n.kt-timeline { background: var(--color-surface); border: 1px solid var(--color-divider); padding: var(--space-4) var(--space-4) 4px; }\n.kt-timeline-row { display: grid; grid-template-columns: 20px 1fr; column-gap: var(--space-4); }\n.kt-timeline-dot-col { display: flex; flex-direction: column; align-items: center; align-self: stretch; }\n.kt-timeline-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--color-neutral-400); flex-shrink: 0; margin-top: 5px; }\n.kt-timeline-dot.is-live { background: var(--status-live); }\n.kt-timeline-dot.is-attention { background: var(--status-attention); }\n.kt-timeline-dot.is-critical { background: var(--status-critical); }\n.kt-timeline-dot.is-pending { background: transparent; box-shadow: inset 0 0 0 1.5px var(--color-neutral-500); }\n.kt-timeline-line { width: 2px; flex: 1; margin: 4px 0; background: var(--color-accent-400); min-height: 16px; }\n.kt-timeline-line.is-upcoming { background: var(--color-neutral-300); }\n.kt-timeline-item { padding-bottom: var(--space-6); }\n.kt-timeline-item-title { font-size: 13px; font-weight: 600; }\n.kt-timeline-item-title.is-upcoming { color: var(--color-neutral-700); }\n.kt-timeline-item-meta { font-size: 12px; color: var(--color-neutral-700); margin-top: 2px; }\n@media (forced-colors: active) { .kt-timeline-dot { border: 1px solid currentColor; } .kt-timeline-dot.is-pending { box-shadow: none; border: 1.5px solid currentColor; } }\n\n/* ── New component: step progression ── */\n.kt-steps {\n  display: grid;\n  grid-template-columns: 32px 1fr 32px 1fr 32px;\n  grid-template-rows: auto auto;\n  row-gap: var(--space-3);\n  align-items: center;\n}\n.kt-steps-node {\n  grid-row: 1;\n  width: 32px; height: 32px; border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-heading); font-weight: 600;\n  color: #fff;\n}\n.kt-steps-node.is-complete { background: var(--status-live); }\n.kt-steps-node.is-active { background: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-100); }\n.kt-steps-node.is-pending { background: var(--color-bg); color: var(--color-neutral-600); }\n.kt-steps-line { grid-row: 1; height: 2px; margin: 0 6px; background: var(--color-neutral-300); }\n.kt-steps-line.is-complete { background: var(--status-live); }\n.kt-steps-label { grid-row: 2; }\n.kt-steps-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }\n.kt-steps-label.is-active .kt-steps-title { font-weight: 700; color: var(--color-accent-700); }\n\n/* ── New component: KPI card ── */\n.kt-kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-3); }\n.kt-kpi-card { position: relative; background: transparent; border-radius: 0; padding: var(--space-4) var(--space-5) var(--space-4) calc(var(--space-5) + 4px); display: flex; flex-direction: column; gap: var(--space-2); box-shadow: inset 4px 0 0 var(--kt-kpi-bar, var(--color-neutral-400)); } /* square card, left bar: neutral by default, status hue only for an owner-declared state */\n.kt-kpi-card.is-attention { --kt-kpi-bar: var(--status-attention); }\n.kt-kpi-card.is-critical { --kt-kpi-bar: var(--status-critical); }\n.kt-kpi-card.is-live { --kt-kpi-bar: var(--status-live); }\n.kt-kpi-icon { width: 18px; height: 18px; color: var(--color-accent-700); }\n.kt-kpi-head { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; font-weight: 600; color: var(--color-neutral-800); }\n.kt-kpi-value { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 30px; color: var(--color-figure); font-variant-numeric: tabular-nums; line-height: 1.1; display: flex; align-items: baseline; gap: 8px; }\n.kt-kpi-sub { font-size: 13px; color: var(--color-neutral-700); text-wrap: pretty; }\n@media (forced-colors: active) { .kt-kpi-card { box-shadow: none; border: 1px solid CanvasText; border-left: 4px solid CanvasText; } }\n@media print { .kt-kpi-card { box-shadow: none; border: 1px solid #000; border-left: 4px solid #000; } }\n\n/* ── New component: notice / advisory banner ── */\n.kt-notice { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-4); border-radius: var(--radius-control); /* DS-REV-005: flat strip, matches controls */ background: var(--color-accent-100); }\n.kt-notice-icon { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; color: var(--color-accent-700); }\n.kt-notice-body { font-size: 14px; color: var(--color-neutral-800); }\n.kt-notice-body strong { color: var(--color-text); }\n.kt-notice.is-warning { border-left-color: var(--status-attention); background: var(--status-attention-bg); }\n.kt-notice.is-warning .kt-notice-icon { color: var(--status-attention); }\n.kt-notice.is-critical { border-left-color: var(--status-critical); background: var(--status-critical-bg); }\n.kt-notice.is-critical .kt-notice-icon { color: var(--status-critical); }\n.kt-notice.is-live { border-left-color: var(--status-live); background: var(--status-live-bg); }\n.kt-notice.is-live .kt-notice-icon { color: var(--status-live); }\n@media (forced-colors: active) { .kt-notice { border: 1px solid CanvasText; } }\n@media print { .kt-notice { background: #fff; border-color: #000; box-shadow: none; } .kt-notice-icon { display: none; } }\n\n/* ── New component: checkbox ── */\n.kt-checkbox { display: inline-flex; align-items: flex-start; gap: 8px; cursor: pointer; font-size: 14px; }\n.kt-checkbox input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }\n.kt-checkbox .box { width: 16px; height: 16px; flex: none; margin-top: 2px; border-radius: var(--radius-sm); border: 1.5px solid var(--color-neutral-500); background: var(--color-surface); position: relative; }\n.kt-checkbox:hover .box { border-color: var(--color-accent); }\n.kt-checkbox input:checked + .box { background: var(--color-accent); border-color: var(--color-accent); }\n.kt-checkbox input:checked + .box::after { content: \"\"; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }\n.kt-checkbox input:focus-visible + .box { outline: 1px solid var(--color-accent-700); outline-offset: 2px; }\n@media (forced-colors: active) { .kt-checkbox .box { border-color: CanvasText; } .kt-checkbox input:checked + .box { background: CanvasText; border-color: CanvasText; } .kt-checkbox input:checked + .box::after { border-color: Canvas; } }\n@media print { .kt-checkbox .box { border-color: #000; } .kt-checkbox input:checked + .box { background: #000; border-color: #000; } }\n\n/* ── New component: tabs ── */\n.kt-tabs { display: flex; gap: var(--space-6); border-bottom: 1px solid var(--color-divider); flex-wrap: wrap; }\n.kt-tab { position: relative; display: inline-flex; align-items: center; gap: var(--space-2); padding-bottom: var(--space-3); font-size: 14px; color: var(--color-neutral-700); cursor: pointer; white-space: nowrap; transition: color var(--motion-fast) var(--ease-standard); }\n.kt-tab input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }\n.kt-tab::after { content: \"\"; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: transparent; transition: background-color var(--motion-base) var(--ease-standard); }\n.kt-tab:has(input:checked) { color: var(--color-accent-800); font-weight: 600; }\n.kt-tab:has(input:checked)::after { background: var(--color-accent); }\n.kt-tab:hover:not(:has(input:checked)) { color: var(--color-text); }\n.kt-tab:has(input:focus-visible) { outline: 1px solid var(--color-accent-700); outline-offset: 2px; }\n@media (forced-colors: active) { .kt-tab:has(input:checked)::after { background: CanvasText; } }\n@media print { .kt-tabs { display: none; } }\n\n/* ── New component: record card ── */\n.kt-record { background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-lg); overflow: hidden; display: block; }\n.kt-record summary { list-style: none; cursor: pointer; }\n.kt-record summary::-webkit-details-marker { display: none; }\n.kt-record-main { display: flex; gap: var(--space-4); padding: var(--space-4); align-items: flex-start; }\n.kt-record-index { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--color-neutral-100); border: 1px solid var(--color-divider); font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--color-neutral-700); }\n.kt-record-body { flex: 1; min-width: 0; }\n.kt-record-ref { font-size: 12px; color: var(--color-neutral-700); }\n.kt-record-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 17px; margin-top: 2px; }\n.kt-record-meta { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--color-neutral-700); }\n.kt-record-value { text-align: right; flex: none; }\n.kt-record-amount { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; }\n.kt-record-sub { font-size: 12px; color: var(--color-neutral-700); margin-top: 2px; }\n.kt-record-footer { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-divider); font-size: 13px; }\n.kt-record-footer-label { color: var(--color-neutral-700); margin-right: 6px; }\n.kt-record-footer > span:first-child { white-space
