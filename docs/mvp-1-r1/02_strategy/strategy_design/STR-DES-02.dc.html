<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/kentender-industry-82d82607-fd52-491b-bef1-023d4ec3bd0c/styles.css">
<script src="_ds/kentender-industry-82d82607-fd52-491b-bef1-023d4ec3bd0c/_ds_bundle.js"></script>
</helmet>
<dc-import name="Shell" breadcrumb="Home > Strategy Alignment > New strategic plan" hint-size="100%,820px">
<div data-screen-label="STR-DES-02" style="max-width:820px;margin:0 auto;padding:var(--space-8) var(--space-6) 120px">
  <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-6)">
    <h1 style="font-size:30px;margin:0">New strategic plan</h1>
    <span class="kt-status is-draft">Draft</span>
  </div>
  <div class="card blueprint" style="max-width:640px;padding:var(--space-4)">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="kt-card-title">Plan identity</div>
    <div style="display:grid;gap:var(--space-4)">
      <div class="field"><label>Plan reference</label><div class="input" style="background:var(--color-surface-2);color:var(--color-neutral-500)">Not assigned</div></div>
      <div class="field"><label>Plan title</label><input class="input" value="Ministry of Health Strategic Plan 2028&ndash;2032 (Demo)" /></div>
      <div class="field"><label>Plan role</label><select class="input" style="max-width:260px"><option>Primary</option><option>Supporting Framework</option></select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)">
        <div class="field"><label>Plan period start</label><div class="date-field"><span>1 Jul 2028</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></div></div>
        <div class="field"><label>Plan period end</label><div class="date-field"><span>30 Jun 2033</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></div></div>
      </div>
    </div>
  </div>
</div>
<div style="position:sticky;bottom:0;background:var(--color-surface);border-top:1px solid var(--color-divider);padding:var(--space-4) var(--space-6);display:flex;justify-content:flex-end;gap:var(--space-3)">
  <button type="button" class="btn btn-secondary">Cancel</button>
  <button type="button" class="btn btn-primary">Save draft</button>
</div>
</dc-import>
</x-dc>
</body>
</html>
