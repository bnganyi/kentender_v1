<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/styles.css">
  <script src="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--color-bg); }
    .kthdr { padding: 10px 32px; border-bottom: 1px solid var(--color-neutral-300); font-size: 13px; color: var(--color-neutral-700); display: flex; justify-content: space-between; }
    .kt-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--color-neutral-300); gap:24px; }
    .kt-row:last-child { border-bottom: none; }
    .kt-row label { color: var(--color-neutral-700); font-size: 14px; min-width:180px; }
    .kt-row input { flex:1; border:1px solid var(--color-neutral-400); border-radius:var(--radius-sm); padding:8px 10px; font-size:14px; font-family:var(--font-body); }
  </style>
</helmet>
<div style="min-height:100vh; font-family:var(--font-body); padding-bottom:88px;">
  <div class="kthdr"><span>Home &gt; Standard Tender Documents &gt; KE-PPRA-IT &gt; Source and Profile</span><span>Amina Hassan</span></div>
  <div style="max-width:840px; margin:0 auto; padding:40px 32px 0;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:24px;">
      <h1 style="font-family:var(--font-heading); font-weight:600; font-size:28px; margin:0;">Source and Profile</h1>
      <div><span style="color:var(--color-neutral-600); font-size:13px; margin-right:10px;">Draft Version 1</span><span class="kt-status is-live">Complete</span></div>
    </div>

    <div class="blueprint" style="position:relative; border:1px solid var(--color-neutral-400); padding:20px 24px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div class="kt-row"><label>Package code</label><span>{{ s.packageCode }}</span></div>
      <div class="kt-row"><label>Official title</label><input value="{{ s.officialTitle }}" onChange="{{ onTitle }}"/></div>
      <div class="kt-row"><label>Official issue</label><input value="{{ s.officialIssue }}" onChange="{{ onIssue }}"/></div>
      <div class="kt-row"><label>Requirement profile</label><span>{{ s.requirementProfile }}</span></div>
      <div class="kt-row"><label>Official source</label><span>{{ s.officialSourceFile }} · View · Replace</span></div>
    </div>
  </div>
  <div style="position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--color-neutral-300); padding:16px 32px; display:flex; justify-content:space-between;">
    <a href="STD_Package_Home.dc.html" class="btn btn-ghost">Back to package</a>
    <button class="btn btn-primary" onClick="{{ onSave }}">{{ saveLabel }}</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { s: null, saved: false };
  async componentDidMount() {
    const store = await import('./std-store.js');
    this.store = store;
    this.setState({ s: store.load() });
  }
  renderVals() {
    const s = this.state.s;
    if (!s) return {};
    return {
      s,
      onTitle: (e) => { this.store.patchTopLevel({ officialTitle: e.target.value }); this.setState({ s: this.store.load() }); },
      onIssue: (e) => { this.store.patchTopLevel({ officialIssue: e.target.value }); this.setState({ s: this.store.load() }); },
      saveLabel: this.state.saved ? 'Saved' : 'Save Source and Profile',
      onSave: () => {
        this.store.saveArea('source-profile', {});
        this.setState({ saved: true, s: this.store.load() });
        setTimeout(() => this.setState({ saved: false }), 1800);
      },
    };
  }
}

</script>
</body>
</html>
