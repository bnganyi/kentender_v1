<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/styles.css">
<script src="_ds/industry-f4215206-dde7-4912-856f-50b1076a52f6/_ds_bundle.js"></script>
</helmet>
<div style="margin-bottom:2px;">
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
    <label style="font-size:12px;font-weight:600;color:var(--color-neutral-700);text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-body);">{{ label }}</label>
    <sc-if value="{{ required }}"><span style="font-size:10px;color:var(--color-accent-700);font-weight:700;">Required</span></sc-if>
  </div>

  <sc-if value="{{ isReadonly }}">
    <div style="font-size:15px;padding:7px 0 2px;color:var(--color-text);">{{ value }}</div>
    <div style="font-size:11px;color:var(--color-neutral-500);">{{ source }}</div>
  </sc-if>

  <sc-if value="{{ isText }}">
    <div style="border:1px solid var(--color-neutral-400);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;background:var(--color-bg);margin-top:4px;">{{ value }}</div>
  </sc-if>

  <sc-if value="{{ isSelect }}">
    <sc-if value="{{ hasSuffix }}">
      <div style="display:flex;margin-top:4px;">
        <div style="flex:1;border:1px solid var(--color-neutral-400);border-right:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;background:var(--color-bg);">
          <span>{{ value }}</span><span style="color:var(--color-accent-700);">▾</span>
        </div>
        <div style="border:1px solid var(--color-neutral-400);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:8px 12px;font-size:13px;background:var(--color-neutral-100);color:var(--color-neutral-600);white-space:nowrap;display:flex;align-items:center;">{{ suffix }}</div>
      </div>
    </sc-if>
    <sc-if value="{{ !hasSuffix }}">
      <div style="border:1px solid var(--color-neutral-400);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;background:var(--color-bg);margin-top:4px;">
        <span>{{ value }}</span><span style="color:var(--color-accent-700);">▾</span>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{ isDate }}">
    <div style="border:1px solid var(--color-neutral-400);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;background:var(--color-bg);margin-top:4px;">
      <span>{{ value }}</span><span style="color:var(--color-neutral-500);">▤</span>
    </div>
  </sc-if>

  <sc-if value="{{ isNumber }}">
    <div style="display:flex;margin-top:4px;">
      <div style="flex:1;border:1px solid var(--color-neutral-400);border-right:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);padding:8px 10px;font-size:14px;background:var(--color-bg);">{{ value }}</div>
      <div style="border:1px solid var(--color-neutral-400);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:8px 12px;font-size:13px;background:var(--color-neutral-100);color:var(--color-neutral-600);white-space:nowrap;display:flex;align-items:center;">{{ suffix }}</div>
    </div>
  </sc-if>

  <sc-if value="{{ isSwitch }}">
    <div style="margin-top:4px;">
      <sc-if value="{{ selectedIsYes }}">
        <div style="display:inline-flex;border:1px solid var(--color-neutral-400);border-radius:999px;overflow:hidden;font-size:12px;">
          <div style="padding:6px 14px;color:var(--color-neutral-500);">No</div>
          <div style="padding:6px 14px;background:var(--color-accent);color:#fff;font-weight:600;">Yes</div>
        </div>
      </sc-if>
      <sc-if value="{{ !selectedIsYes }}">
        <div style="display:inline-flex;border:1px solid var(--color-neutral-400);border-radius:999px;overflow:hidden;font-size:12px;">
          <div style="padding:6px 14px;background:var(--color-accent);color:#fff;font-weight:600;">No</div>
          <div style="padding:6px 14px;color:var(--color-neutral-500);">Yes</div>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isFile }}">
    <div class="card blueprint" style="padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px;">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div><div style="font-size:14px;font-weight:600;">{{ value }}</div><div style="font-size:12px;color:var(--color-neutral-600);margin-top:2px;">{{ source }}</div></div>
      <span class="tag tag-outline">Protected · View only</span>
    </div>
  </sc-if>

  <sc-if value="{{ isSupplier }}">
    <div style="border:1px dashed var(--color-neutral-400);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-style:italic;color:var(--color-neutral-600);background:var(--color-neutral-100);margin-top:4px;">{{ value }}</div>
  </sc-if>

  <sc-if value="{{ hasHelp }}">
    <div style="font-size:11px;color:var(--color-neutral-500);margin-top:4px;">{{ help }}</div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:80},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;readonly&quot;,&quot;options&quot;:[&quot;readonly&quot;,&quot;text&quot;,&quot;select&quot;,&quot;date&quot;,&quot;number&quot;,&quot;switch&quot;,&quot;file&quot;,&quot;supplier&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Label&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Value&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;source&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;suffix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;help&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const kind = p.kind || 'readonly';
    return {
      label: p.label || '', value: p.value || '', source: p.source || '', suffix: p.suffix || '',
      help: p.help || '', hasHelp: !!p.help, required: !!p.required, hasSuffix: !!(p.suffix),
      isReadonly: kind === 'readonly', isText: kind === 'text', isSelect: kind === 'select',
      isDate: kind === 'date', isNumber: kind === 'number', isSwitch: kind === 'switch',
      isFile: kind === 'file', isSupplier: kind === 'supplier',
      selectedIsYes: p.value === 'Yes',
    };
  }
}
</script>
</body>
</html>
